<style>
@font-face{font-family:'LB';font-weight:700;font-style:normal;font-display:swap;src:url('logbook/fonts/manrope-latin-700-normal.woff2') format('woff2')}
:root{--bg:#fff;--ink:#111;--soft:#555;--mute:#777;--line:#e8e8e6;--tint:#f6f6f3;--side:#fafaf8;--r:18px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:500 15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit}button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid #111;outline-offset:2px;border-radius:6px}
.hide{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;border:1.5px solid #111;background:#111;color:#fff;font-weight:700;font-size:14.5px;text-decoration:none;cursor:pointer;transition:transform .15s,background .15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}.btn.ghost{background:#fff;color:#111}.btn.sm{min-height:36px;padding:0 15px;font-size:13.5px}.btn[disabled]{opacity:.5;cursor:default;transform:none}
.k{font-weight:700;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
h1,h2,h3{letter-spacing:-.035em;line-height:1.05;font-weight:700}
.dot{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.12) inset}
.err{color:#b00020;font-weight:600;font-size:13.5px;min-height:20px;margin:6px 0 0}
.note{font-size:13px;color:var(--mute);margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:#111;color:#fff;padding:12px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(min-width:1000px){.toast{bottom:28px}}

/* ---------- signed-out landing ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em;text-decoration:none;font-size:17px}
.brand i{width:22px;height:22px;border:2.5px solid #111;border-radius:50%;position:relative;display:inline-block;flex:none}
.brand i:after{content:"";position:absolute;inset:6px;background:#111;border-radius:50%}
.links{display:flex;gap:4px;align-items:center}
.links a{padding:9px 14px;border-radius:999px;text-decoration:none;font-weight:600;font-size:14px;color:var(--soft)}
.links a:hover{background:var(--tint);color:var(--ink)}
.hero{display:grid;gap:36px;padding:72px 0 56px;align-items:center}
@media(min-width:960px){.hero{grid-template-columns:1.2fr .8fr;gap:64px;padding:96px 0 80px}}
.hero h1{font-size:clamp(42px,7.4vw,84px);line-height:.96;letter-spacing:-.048em;max-width:11ch}
.hero p.lede{margin-top:22px;font-size:clamp(17px,2vw,20px);color:var(--soft);max-width:44ch}
.hero .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}
.panel{border:1px solid var(--line);border-radius:var(--r);padding:24px;background:#fff}
.panel.lift{box-shadow:0 30px 60px -34px rgba(0,0,0,.35)}
.field{display:block;margin-bottom:16px}
.field>span,.lab{display:block;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin-bottom:7px}
input[type=text],input[type=email],input[type=password],input[type=search],select{width:100%;height:48px;border:1.5px solid #d9d9d6;border-radius:13px;padding:0 15px;background:#fff;font-size:16px;font-weight:500}
input:focus,select:focus{outline:none;border-color:#111}
.tog{margin-top:12px;font-size:14px;color:var(--soft)}.tog button{border:0;background:none;font-weight:700;text-decoration:underline;cursor:pointer;padding:6px}
.feats{display:grid;gap:14px;padding:6px 0 34px}
@media(min-width:800px){.feats{grid-template-columns:repeat(3,1fr);gap:20px}}
.feat{border-top:2px solid #111;padding-top:14px}.feat b{display:block;font-size:18px;letter-spacing:-.02em;margin-bottom:4px}.feat p{color:var(--soft);font-size:14.5px}
.band{background:var(--tint);padding:56px 0}
.sec{padding:56px 0}
.sec h2{font-size:clamp(28px,4vw,42px)}.sub{margin-top:10px;color:var(--soft);max-width:60ch}

/* ---------- logbook cards / library ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:24px}
@media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr);gap:18px}}
.card{border:1px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:0 14px 34px -18px rgba(0,0,0,.25);transform:translateY(-2px)}
.card .art{height:190px;overflow:hidden;background:var(--tint);border-bottom:1px solid var(--line)}
.card .art img{display:block;width:84%;margin:16px auto 0;border-radius:18px 18px 0 0;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 14px 26px -14px rgba(0,0,0,.4)}
.card .art.make{display:grid;place-items:center;background:#fff}
.card .art.make b{width:64px;height:64px;border-radius:50%;border:2px dashed #bbb;display:grid;place-items:center;font-size:30px;font-weight:500;color:#888}
.card .body{padding:14px 14px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .nm{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.02em;font-size:17px}
.card p{font-size:13.5px;line-height:1.4;color:var(--soft)}
.card .acts{display:flex;gap:8px;margin-top:auto;padding-top:12px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:#111;color:#fff;border-radius:999px;padding:2px 8px;margin-left:auto}

/* ---------- builder ---------- */
.build{display:grid;gap:22px;margin-top:24px}
@media(min-width:900px){.build{grid-template-columns:1.1fr .9fr;align-items:start}}
.sw{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sw button{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px #d5d5d5;cursor:pointer;padding:0}
.sw button[aria-pressed=true]{box-shadow:0 0 0 2.5px #111}
.sw label{width:40px;height:40px;border-radius:50%;border:1.5px dashed #aaa;display:grid;place-items:center;cursor:pointer;font-size:18px;color:#777;overflow:hidden;position:relative}
.sw input[type=color]{position:absolute;inset:-8px;width:60px;height:60px;opacity:0;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:40px;padding:0 15px;border-radius:999px;border:1.5px solid #d5d5d5;background:#fff;font-weight:600;font-size:14px;cursor:pointer}
.chips button[aria-pressed=true]{background:#111;border-color:#111;color:#fff}
.prev{border-radius:24px;padding:22px;color:#fff;min-height:230px;display:flex;flex-direction:column;justify-content:space-between;transition:background .25s}
.prev small{font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.8;font-size:11px}
.prev h3{font-size:32px;line-height:1;margin-top:8px;word-break:break-word}
.prev .st{display:flex;gap:10px;margin-top:18px}.prev .st div{flex:1;border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.18)}
.prev .st b{display:block;font-size:22px;letter-spacing:-.03em}.prev .st span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.prev .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}.prev .tags i{font-style:normal;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.2)}
.mine{margin-top:22px}.mine h3{font-size:18px;margin-bottom:10px}
.mrow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px;background:#fff}
.mrow b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .x{border:0;background:none;color:var(--mute);cursor:pointer;font-size:13px;font-weight:600;padding:8px}

/* ---------- install sheet ---------- */
dialog{border:0;border-radius:24px;padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 24px);box-shadow:0 30px 80px -20px rgba(0,0,0,.45);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.sheet{padding:26px;overflow:auto;max-height:calc(100vh - 24px)}
.sheet h3{font-size:26px;padding-right:40px}
.sheet .close{position:absolute;right:14px;top:14px;width:40px;height:40px;border-radius:50%;border:0;background:var(--tint);font-size:20px;cursor:pointer}
.urlbox{display:flex;gap:8px;margin-top:16px}.urlbox input{flex:1;min-width:0;font-size:14px;height:46px}
.qrrow{display:flex;gap:18px;align-items:center;margin-top:18px;padding:16px;border-radius:18px;background:var(--tint)}
.qrrow #dq{width:112px;height:112px;flex:none;background:#fff;border-radius:10px;padding:6px}.qrrow p{font-size:14px;color:var(--soft)}
.tabs{display:flex;gap:6px;margin-top:20px}.tabs button{flex:1;min-height:40px;border-radius:999px;border:1.5px solid #d5d5d5;background:#fff;font-weight:700;font-size:14px;cursor:pointer}
.tabs button[aria-selected=true]{background:#111;color:#fff;border-color:#111}
ol.steps{margin:14px 0 0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;padding:8px 0;font-size:15px}
ol.steps li:before{content:counter(s);width:26px;height:26px;border-radius:50%;background:#111;color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;margin-top:1px}

/* ---------- signed-in app shell ---------- */
.shell{min-height:100vh}
.side{display:none}
.main{padding:22px 20px calc(96px + env(safe-area-inset-bottom));max-width:1240px}
.mtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;font-size:11.5px;font-weight:700;text-decoration:none;color:var(--mute);border-radius:12px}
.tabbar a[aria-current=page]{color:#111;background:var(--tint)}
.tabbar svg{width:22px;height:22px}
@media(min-width:1000px){
  .shell{display:grid;grid-template-columns:268px 1fr}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);padding:22px 16px 18px}
  .side .brand{padding:2px 10px 18px}
  .side nav{display:flex;flex-direction:column;gap:2px}
  .side nav a,.side .lbl a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;text-decoration:none;font-weight:600;font-size:14.5px;color:var(--soft)}
  .side nav a:hover,.side .lbl a:hover{background:#f0f0ec;color:var(--ink)}
  .side [aria-current=page]{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line),0 4px 12px -8px rgba(0,0,0,.3)}
  .side svg{width:19px;height:19px;flex:none}
  .side .k{padding:18px 12px 6px}
  .side .lbl{display:flex;flex-direction:column;gap:2px;overflow:auto;min-height:0}
  .side .lbl a small{margin-left:auto;font-weight:700;color:var(--mute);font-size:12px}
  .side .me{margin-top:auto;border-top:1px solid var(--line);padding:14px 10px 0;font-size:13px;color:var(--soft);word-break:break-all}
  .side .me button{display:block;margin-top:8px;border:0;background:none;font-weight:700;text-decoration:underline;cursor:pointer;padding:2px 0;font-size:13px}
  .main{padding:34px 40px 60px;width:100%}
  .tabbar,.mtop{display:none}
}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.vh h1{font-size:clamp(28px,3.6vw,40px)}.vh .sub{margin-top:6px}
.vh .acts{display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr);gap:16px}.kpis.five{grid-template-columns:repeat(5,1fr)}}
.kpi{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;background:#fff}
.kpi b{display:block;font-size:clamp(28px,3vw,38px);letter-spacing:-.045em;line-height:1.05;margin-top:6px}
.kpi small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.cols{display:grid;gap:16px;margin-top:16px}
@media(min-width:1100px){.cols.two{grid-template-columns:1.6fr 1fr}.cols.eq{grid-template-columns:1fr 1fr}}
.box{border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;background:#fff;min-width:0}
.box h3{font-size:18px;margin-bottom:2px}.box .hint{color:var(--mute);font-size:13px}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;margin-top:16px}
.hm i{display:block;aspect-ratio:1;border-radius:4px;background:#ecece8;min-width:0}
.hmw{overflow-x:auto;padding-bottom:4px}
.hmw .hm{min-width:420px}
.lg{display:flex;align-items:center;gap:5px;margin-top:12px;font-size:12px;color:var(--mute)}.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;margin-top:18px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;min-width:0}
.bars i{display:block;width:100%;border-radius:8px 8px 3px 3px;min-height:4px;background:#111;transition:height .5s}
.bars span{font-size:11.5px;color:var(--mute);font-weight:600}.bars em{font-style:normal;font-size:12px;font-weight:700}
.lbgrid{display:grid;gap:14px;margin-top:16px}
@media(min-width:700px){.lbgrid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1180px){.lbgrid{grid-template-columns:repeat(3,1fr)}}
.lbc{display:block;text-decoration:none;border:1px solid var(--line);border-radius:var(--r);padding:18px;background:#fff;transition:box-shadow .2s,transform .2s}
.lbc:hover{box-shadow:0 14px 34px -18px rgba(0,0,0,.28);transform:translateY(-2px)}
.lbc .t{display:flex;align-items:center;gap:9px}.lbc h3{font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbc .m{display:flex;gap:18px;margin-top:14px}.lbc .m b{display:block;font-size:26px;letter-spacing:-.04em;line-height:1}.lbc .m span{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.strip{display:grid;gap:3px;margin-top:14px}.strip i{aspect-ratio:1;border-radius:3px;background:#ecece8}
.feed{list-style:none;padding:0;margin-top:10px}
.feed li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}.feed li:first-child{border-top:0}
.feed .d{width:46px;flex:none;text-align:center;line-height:1.1}.feed .d b{display:block;font-size:19px;letter-spacing:-.03em}.feed .d span{font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase}
.feed .w{min-width:0}.feed .w b{display:flex;align-items:center;gap:7px;font-size:14.5px}.feed .w p{font-size:13px;color:var(--soft)}
.use{display:grid;gap:10px;margin-top:14px}.use>div{display:grid;grid-template-columns:150px 1fr 52px;gap:12px;align-items:center;font-size:14px;font-weight:600}
.use .tr{height:10px;border-radius:6px;background:#ecece8;overflow:hidden}.use .tr i{display:block;height:100%;border-radius:6px}.use>div>span:last-child{color:var(--mute);text-align:right;font-weight:700}
@media(max-width:560px){.use>div{grid-template-columns:104px 1fr 40px}}
.tbl{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);padding:8px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.dr{cursor:pointer}.tbl tr.dr:hover td{background:var(--tint)}
.tbl .tg{display:flex;flex-wrap:wrap;gap:5px}.tbl .tg i{font-style:normal;font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.tbl pre{background:var(--tint);border-radius:12px;padding:12px;font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;overflow:auto;max-height:300px;white-space:pre-wrap;word-break:break-word;margin:4px 0}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.tools input,.tools select{width:auto;flex:1;min-width:160px;height:42px;font-size:14.5px}
.empty{border:1.5px dashed #d0d0cc;border-radius:var(--r);padding:28px;color:var(--soft);background:#fff}
.empty h3{color:var(--ink);font-size:22px;margin-bottom:8px}
.empty ol{margin:14px 0 18px 20px;display:grid;gap:6px}
.sk{height:96px;border-radius:var(--r);background:linear-gradient(90deg,#f1f1ee,#f8f8f6,#f1f1ee);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.acct{display:grid;gap:16px;max-width:720px}.acct dl{display:grid;grid-template-columns:140px 1fr;gap:10px 16px;margin-top:12px;font-size:14.5px}.acct dt{color:var(--mute);font-weight:600}.acct dd{word-break:break-all}
footer.ft{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--mute);font-size:13px}.ft .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

.card.ed{--bg2:#eee;--ink2:#111;--acc2:#111;background:#fff}
.card.ed .art{height:auto;aspect-ratio:4/5;position:relative;background:var(--bg2);color:var(--ink2);border-bottom:0;container-type:inline-size;isolation:isolate}
.card.ed .art svg.mo{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.card.ed .art .tx{position:absolute;left:7cqw;right:7cqw;top:7cqw;z-index:2}
.card.ed .art .tx small{display:block;font-weight:700;font-size:max(9.5px,3.6cqw);letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.card.ed .art .tx b{display:block;margin-top:2.4cqw;font:700 clamp(22px,13.2cqw,44px)/.9 'LB',var(--font);letter-spacing:-.045em;text-transform:uppercase;overflow-wrap:anywhere}
.card.ed .art .tx b em{font-style:normal;color:var(--em2,var(--acc2))}
.card.ed .art .ph{position:absolute;z-index:1;width:46%;right:8%;top:57%;border-radius:7cqw;overflow:hidden;border:.9cqw solid var(--ink2);box-shadow:0 0 0 .3cqw rgba(255,255,255,.15),0 4cqw 8cqw -2cqw rgba(0,0,0,.5);transform:rotate(-6deg);transform-origin:50% 0;transition:transform .35s cubic-bezier(.2,.8,.2,1);background:#fff}
.card.ed .art .ph img{display:block;width:100%;margin:0;border-radius:0;box-shadow:none}
.card.ed:hover .art .ph{transform:translateY(-9%) rotate(-2deg)}

    var th = themeOf(r.name);
    var head = '<div class="hdr" style="' + themeVars(th) + '">' + motif(th.mo, th.acc, 'meet') + '<p class="k"><a href="#/">Dashboard</a> / ' + esc(th.kick) + '</p><h1>' + esc(r.name.n) + '</h1><p class="sub" style="margin-top:10px">Last synced ' + esc(ago(r.updated)) + (r.device ? ' from device ' + esc(String(r.device).slice(0, 8)) : '') + '</p><div class="acts">' + (r.url ? '<a class="btn ghost sm" href="' + esc(r.url) + '">Open logbook</a><button class="btn ghost sm" data-act="install" data-app="' + esc(r.app) + '" type="button">Install</button>' : '') + '<button class="btn sm" data-act="dl" data-app="' + esc(r.app) + '" type="button">Download data</button></div></div>';
    var kp = '<div class="kpis five"><div class="kpi"><span class="k">Streak</span><b>' + r.cur + '</b></div><div class="kpi"><span class="k">Best run</span><b>' + r.best + '</b></div><div class="kpi"><span class="k">Days logged</span><b>' + r.keys.length + '</b></div><div class="kpi"><span class="k">This month</span><b>' + r.month + '</b></div><div class="kpi"><span class="k">Boxes per day</span><b>' + (r.avg ? r.avg.toFixed(1) : '0') + '</b></div></div>';
    var wc = [], i, w, d, t; for(i = 11; i >= 0; i--){ t = 0; for(w = 0; w < 7; w++){ d = new Date(); d.setDate(d.getDate() - i * 7 - w); if(r.set[ymd(d)]) t++; } wc.push(t); }
    var wmax = Math.max.apply(null, wc.concat([1]));
    var wchart = '<div class="bars">' + wc.map(function(n, ix){ return '<div><em>' + (n || '') + '</em><i style="height:' + Math.max(4, Math.round(n / wmax * 118)) + 'px;background:' + (n ? esc(col) : '#ecece8') + '"></i><span>' + (ix === 11 ? 'Now' : '-' + (11 - ix) + 'w') + '</span></div>'; }).join('') + '</div>';
    var um = 1; Object.keys(r.use).forEach(function(p){ if(r.use[p] > um) um = r.use[p]; });
    var use = Object.keys(r.use).sort(function(a, b){ return r.use[b] - r.use[a]; }).map(function(p){ return '<div><span style="color:var(--ink);text-align:left">' + esc(pageName(p, r.data)) + '</span><div class="tr"><i style="width:' + Math.round(r.use[p] / um * 100) + '%;background:' + esc(col) + '"></i></div><span>' + r.use[p] + '</span></div>'; }).join('');
    var months = {}; r.keys.forEach(function(k2){ months[k2.slice(0, 7)] = 1; });
    var mopts = '<option value="">All months</option>' + Object.keys(months).sort().reverse().map(function(m){ return '<option value="' + m + '"' + (filt.m === m ? ' selected' : '') + '>' + esc(new Date(m + '-15T12:00:00').toLocaleDateString(undefined, { month:'long', year:'numeric' })) + '</option>'; }).join('');
    var mon = Object.keys(months).sort().reverse().slice(0, 6).map(function(m){ var n = r.keys.filter(function(k2){ return k2.slice(0, 7) === m; }).length; return '<div><span style="color:var(--ink);text-align:left">' + esc(new Date(m + '-15T12:00:00').toLocaleDateString(undefined, { month:'short', year:'numeric' })) + '</span><div class="tr"><i style="width:' + Math.round(n / 31 * 100) + '%;background:' + esc(col) + '"></i></div><span>' + n + '</span></div>'; }).join('');
    return head + kp
      + '<div class="cols two"><div class="box"><h3>Last 26 weeks</h3><p class="hint">Darker means more boxes filled that day</p>' + heat(26, function(k2){ return r.cnt[k2] || 0; }, col, max) + '</div><div class="box"><h3>Days per week</h3><p class="hint">Last 12 weeks</p>' + wchart + '</div></div>'
      + '<div class="cols eq"><div class="box"><h3>What you log most</h3><p class="hint">Days each box was filled</p><div class="use">' + (use || '<p class="hint">Nothing logged yet.</p>') + '</div></div><div class="box"><h3>Month by month</h3><p class="hint">Days logged</p><div class="use">' + (mon || '<p class="hint">Nothing logged yet.</p>') + '</div></div></div>'
      + '<div class="box" style="margin-top:16px"><h3>Day by day</h3><p class="hint">Click a day to see exactly what was saved</p><div class="tools"><input type="search" id="fq" placeholder="Search a box or a date" value="' + esc(filt.q) + '" aria-label="Search"><select id="fm" aria-label="Month">' + mopts + '</select></div><div id="dtbl">' + dayTable(r) + '</div></div>';
  }
  function dayTable(r){
    var q = filt.q.toLowerCase(), list = r.keys.slice().reverse().filter(function(k){
      if(filt.m && k.slice(0, 7) !== filt.m) return false; if(!q) return true;
      var names = touched(r.days[k]).map(function(p){ return pageName(p, r.data).toLowerCase(); }).join(' ');
      return names.indexOf(q) > -1 || k.indexOf(q) > -1 || dayLabel(k).toLowerCase().indexOf(q) > -1; });
    if(!list.length) return '<p class="hint" style="margin-top:14px">No days match.</p>';
    return '<table class="tbl"><thead><tr><th>Day</th><th>Boxes</th><th style="text-align:right">Filled</th></tr></thead><tbody>' + list.slice(0, 120).map(function(k){
      var t = touched(r.days[k]);
      return '<tr class="dr" data-day="' + k + '"><td style="white-space:nowrap;font-weight:700">' + esc(dayLabel(k, { weekday:'short', month:'short', day:'numeric', year:'numeric' })) + '</td><td><div class="tg">' + t.map(function(p){ return '<i>' + esc(pageName(p, r.data)) + '</i>'; }).join('') + '</div></td><td style="text-align:right">' + t.length + '</td></tr>'; }).join('') + '</tbody></table>' + (list.length > 120 ? '<p class="hint" style="margin-top:10px">Showing the latest 120 of ' + list.length + '. Download the data for everything.</p>' : '');
  }

  function viewLibrary(inShell){
    var have = {}; (rows || []).forEach(function(r){ have[r.app] = 1; });
    var g = PRESETS.map(function(p, ix){
      var th = TH[p.id], words = p.n.split(' '), nm = words.length > 1 ? esc(words[0]) + '<br><em>' + esc(words.slice(1).join(' ')) + '</em>' : '<em>' + esc(p.n) + '</em>';
      return '<article class="card ed" style="' + themeVars(th) + (th.em ? ';--em2:' + th.em : '') + '"><div class="art">' + motif(th.mo, th.acc) + '<div class="tx"><small>' + esc(th.kick) + '</small><b>' + nm + '</b></div><div class="ph"><img src="logbook/shots/' + p.id + '/' + th.shot + '.jpg" alt="' + esc(p.n) + ' app screen" loading="lazy" width="520" height="1126"></div><span class="no">No. 0' + (ix + 1) + '</span></div><div class="body"><div class="nm" style="font-size:15px"><span class="dot" style="background:' + th.acc + '"></span>' + esc(p.n) + (have[p.key] ? '<span class="badge">Synced</span>' : '') + '</div><p>' + esc(p.t) + '</p><div class="acts"><a class="btn sm" href="logbook/?l=' + p.id + '">Open</a><button class="btn ghost sm" type="button" data-act="inst" data-i="' + p.id + '">Install</button></div></div></article>'; }).join('')
      + '<article class="card"><div class="art make" style="aspect-ratio:4/5;height:auto"><b aria-hidden="true">+</b></div><div class="body"><div class="nm">Your own</div><p>Name it, colour it, choose the boxes.</p><div class="acts"><a class="btn sm" href="' + (inShell ? '#/create' : '#create') + '">Create</a></div></div></article>';
    return '<div class="grid" id="presets">' + g + '</div>';
  }
  function viewCreate(){
    var sw = SWATCH.map(function(c){ return '<button type="button" style="background:' + c + '" data-c="' + c + '" aria-label="Colour ' + c + '" aria-pressed="' + (cs.a.toLowerCase() === c.toLowerCase()) + '"></button>'; }).join('') + '<label title="Pick any colour" aria-label="Pick any colour">+<input type="color" id="ccol" value="' + cs.a + '"></label>';
    var bx = BOXES.map(function(b){ return '<button type="button" data-b="' + b[0] + '" aria-pressed="' + (cs.b.indexOf(b[0]) > -1) + '">' + esc(b[1]) + '</button>'; }).join('');
    return '<div class="build"><div class="panel"><label class="field"><span>Name</span><input type="text" id="cn" maxlength="22" placeholder="My Gym" autocomplete="off" value="' + esc(cs.n) + '"></label><div class="field"><span class="lab">Colour</span><div class="sw" id="csw">' + sw + '</div></div><div class="field"><span class="lab">What goes in it</span><div class="chips" id="cbx">' + bx + '</div></div><button class="btn" data-act="make" type="button">Create my logbook</button><p class="err" id="cerr" role="alert"></p></div>'
      + '<div><div class="prev" id="cpv"><div><small>Your logbook</small><h3 id="cpn"></h3></div><div><div class="st"><div><b>6</b><span>Day streak</span></div><div><b>2/4</b><span>Today</span></div></div><div class="tags" id="cpt"></div></div></div>'
      + '<div class="mine" id="mine">' + mineHtml() + '</div></div></div>';
  }
  function mineHtml(){ return saved.length ? '<h3>Your logbooks</h3>' + saved.map(function(o, i){ return '<div class="mrow"><span class="dot" style="background:' + esc(o.a) + '"></span><b>' + esc(o.n) + '</b><a class="btn sm" href="' + esc(urlFor(o)) + '">Open</a><button class="btn ghost sm" type="button" data-act="minst" data-i="' + i + '">Install</button><button class="x" type="button" data-act="mdel" data-i="' + i + '" aria-label="Remove ' + esc(o.n) + ' from this list">Remove</button></div>'; }).join('') : ''; }
  function darken(hex){ var r = parseInt(hex.substr(1,2),16), g2 = parseInt(hex.substr(3,2),16), b = parseInt(hex.substr(5,2),16), l = (Math.max(r,g2,b) + Math.min(r,g2,b)) / 510, f = l > .34 ? .34 / l : 1; return 'rgb(' + Math.round(r*f) + ',' + Math.round(g2*f) + ',' + Math.round(b*f) + ')'; }
  function pv(){ var p = $('cpv'); if(!p) return; p.style.background = darken(cs.a); $('cpn').textContent = cs.n || 'My Logbook'; $('cpt').innerHTML = cs.b.map(function(i){ return '<i>' + esc(BN[i]) + '</i>'; }).join(''); }

  function viewAccount(){
    var size = (rows || []).reduce(function(a, r){ return a + r.size; }, 0);
    return '<div class="vh"><div><h1>Account</h1></div></div><div class="acct"><div class="box"><h3>Signed in</h3><dl><dt>Email</dt><dd>' + esc(sess.email || '') + '</dd><dt>Logbooks synced</dt><dd>' + (rows ? rows.length : 0) + '</dd><dt>Data stored</dt><dd>' + Math.max(1, Math.round(size / 1024)) + ' KB</dd><dt>Last checked</dt><dd>' + (lastLoad ? esc(ago(new Date(lastLoad))) : 'Not yet') + '</dd></dl><div style="margin-top:18px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" data-act="refresh" type="button">Refresh</button><button class="btn" data-act="signout" type="button">Sign out</button></div></div>'
      + '<div class="box"><h3>How your logbooks stay separate</h3><p class="hint" style="margin-top:6px;font-size:14px;line-height:1.55">Every logbook has its own storage key, such as <b>readinggirl-logbook-v1</b>. On your phone that is its own private data, so one logbook never reads another. In your account each logbook is its own row, tied to you and locked so only you can read it. They share the same app and the same login, never the same data.</p></div>'
      + '<div class="box"><h3>Turn sync on</h3><p class="hint" style="margin-top:6px;font-size:14px;line-height:1.55">Open a logbook on your phone, sign in with this account, then go to Settings and switch Sync on. Changes upload in the background and appear here.</p></div></div>';
  }

  /* ================= landing (signed out) ================= */
  function authForm(){
    return '<form id="af" novalidate><h3 style="font-size:26px;margin-bottom:4px">' + (mode === 'in' ? 'Sign in' : 'Create an account') + '</h3><p class="sub" style="margin:0 0 18px;font-size:14.5px">' + (mode === 'in' ? 'See everything your logbooks have synced.' : 'One account for every logbook.') + '</p>'
      + '<label class="field"><span>Email</span><input type="email" id="ae" autocomplete="email" inputmode="email"></label><label class="field"><span>Password</span><input type="password" id="ap" autocomplete="' + (mode === 'in' ? 'current-password' : 'new-password') + '"></label>'
      + '<button class="btn" id="ab" type="submit" style="width:100%">' + (mode === 'in' ? 'Sign in' : 'Create account') + '</button><p class="err" id="aerr" role="alert"></p>'
      + '<p class="tog">' + (mode === 'in' ? 'New here?' : 'Already have an account?') + ' <button type="button" data-act="mode">' + (mode === 'in' ? 'Create an account' : 'Sign in') + '</button></p><p class="note">Password reset by email is not switched on yet, so pick a password you will remember.</p></form>';
  }
  function landing(){
    return '<header class="top"><div class="wrap"><a class="brand" href="#top"><i aria-hidden="true"></i>Logbooks</a><nav class="links" aria-label="Sections"><a href="#choose">Logbooks</a><a href="#create">Create your own</a><a href="#signin">Sign in</a></nav></div></header>'
      + '<main id="top"><div class="wrap"><div class="hero"><div><h1>Pick a logbook. Make it yours.</h1><p class="lede">A daily logbook that lives on your phone, works with no signal, and backs up to your account. Sign in here and your whole routine is on one screen.</p><div class="row"><a class="btn" href="#choose">Choose a logbook</a><a class="btn ghost" href="#create">Create your own</a></div></div><div class="panel lift" id="signin">' + authForm() + '</div></div>'
      + '<div class="feats"><div class="feat"><b>One dashboard</b><p>Streaks, heat maps and every day you logged, across all your logbooks.</p></div><div class="feat"><b>Works offline</b><p>Install it on your phone. No signal needed once it has opened.</p></div><div class="feat"><b>Your data stays yours</b><p>Each logbook is stored on its own, locked to your account, and you can download it any time.</p></div></div></div>'
      + '<section class="sec" id="choose"><div class="wrap"><h2>Choose a logbook</h2><p class="sub">Same logbook underneath, a different look and a different starting set. Tap Install to get the link for your phone.</p>' + viewLibrary(false) + '</div></section>'
      + '<section class="band" id="create"><div class="wrap"><h2 style="font-size:clamp(28px,4vw,42px)">Create your own</h2><p class="sub">Name it, pick a colour, choose what goes in it. You get a link to install on your phone.</p>' + viewCreate() + '</div></section></main>'
      + '<footer class="ft"><div class="wrap"><span>&copy; 2026 Clean Routine Co. All rights reserved.</span><span>Made in Ho Chi Minh City</span></div></footer>';
  }

  /* ================= shell (signed in) ================= */
  function route(){ var h = location.hash || ''; var m = /^#\/(lb\/(.+)|library|create|account)?$/.exec(h); if(!m) return { v:'dash' }; if(m[2]){ var a; try{ a = decodeURIComponent(m[2]); }catch(e){ a = m[2]; } return { v:'lb', app:a }; } return { v:m[1] || 'dash' }; }
  function shell(){
    var rt = route(), v = rt.v, body;
    if(v === 'dash') body = viewDash();
    else if(v === 'lb') body = viewLb(rt.app);
    else if(v === 'library') body = '<div class="vh"><div><h1>Library</h1><p class="sub">Open one, or install it on your phone.</p></div></div>' + viewLibrary(true);
    else if(v === 'create') body = '<div class="vh"><div><h1>Create your own</h1><p class="sub">Name it, pick a colour, choose what goes in it.</p></div></div>' + viewCreate();
    else body = viewAccount();
    var cur = function(x){ return v === x ? ' aria-current="page"' : ''; };
    var side = '<aside class="side"><a class="brand" href="#/"><i aria-hidden="true"></i>Logbooks</a><nav aria-label="Main"><a href="#/"' + cur('dash') + '>' + IC.home + 'Dashboard</a><a href="#/library"' + cur('library') + '>' + IC.lib + 'Library</a><a href="#/create"' + cur('create') + '>' + IC.plus + 'Create your own</a></nav>'
      + '<div class="k">Your logbooks</div><div class="lbl">' + ((rows && rows.length) ? rows.map(function(r){ return '<a href="#/lb/' + encodeURIComponent(r.app) + '"' + (v === 'lb' && rt.app === r.app ? ' aria-current="page"' : '') + '><span class="dot" style="background:' + esc(r.name.acc) + '"></span>' + esc(r.name.n) + '<small>' + r.cur + '</small></a>'; }).join('') : '<span style="padding:6px 12px;font-size:13px;color:var(--mute)">' + (loading ? 'Loading…' : 'None synced yet') + '</span>') + '</div>'
      + '<div class="me"><a href="#/account" style="text-decoration:none;font-weight:700;color:var(--ink);display:block">' + esc(sess.email || 'Account') + '</a><button type="button" data-act="signout">Sign out</button></div></aside>';
    var tabs = '<nav class="tabbar" aria-label="Main"><a href="#/"' + cur('dash') + '>' + IC.home + 'Dashboard</a><a href="#/library"' + cur('library') + '>' + IC.lib + 'Library</a><a href="#/create"' + cur('create') + '>' + IC.plus + 'Create</a><a href="#/account"' + cur('account') + '>' + IC.me + 'Account</a></nav>';
    return '<div class="shell">' + side + '<main class="main"><div class="mtop"><a class="brand" href="#/"><i aria-hidden="true"></i>Logbooks</a></div>' + body + '</main></div>' + tabs;
  }

  /* ================= render + events ================= */
  function render(){
    var y = window.scrollY, el = document.activeElement, keep = el && el.id && /^(fq|cn)$/.test(el.id) ? { id:el.id, s:el.selectionStart } : null;
    $('root').innerHTML = sess ? shell() : landing();
    if($('cpv')) pv();
    [].forEach.call(document.querySelectorAll('.hmw'), function(h){ h.scrollLeft = h.scrollWidth; });
    if(keep && $(keep.id)){ $(keep.id).focus(); try{ $(keep.id).setSelectionRange(keep.s, keep.s); }catch(e){} }
    if(sess) window.scrollTo(0, y);
  }
  window.addEventListener('hashchange', function(){ if(sess){ filt = { q:'', m:'' }; render(); window.scrollTo(0, 0); } });
  document.addEventListener('visibilitychange', function(){ if(!document.hidden && sess && lastLoad && Date.now() - lastLoad > 60000) load(false); });

  function rid(){ return Math.random().toString(36).slice(2, 8); }
  function appRow(a){ return (rows || []).filter(function(x){ return x.app === a; })[0]; }
  document.addEventListener('click', function(e){
    var b = e.target.closest('[data-act]');
    if(b){
      var a = b.dataset.act;
      if(a === 'refresh'){ load(true); }
      else if(a === 'signout'){ setSess(null); location.hash = ''; render(); toast('Signed out'); }
      else if(a === 'mode'){ mode = mode === 'in' ? 'up' : 'in'; var f = $('signin'); if(f) f.innerHTML = authForm(); }
      else if(a === 'inst'){ var p = PRESETS.filter(function(x){ return x.id === b.dataset.i; })[0]; install(p.n, urlFor({ preset:p.id })); }
      else if(a === 'install'){ var r = appRow(b.dataset.app); if(r) install(r.name.n, r.url); }
      else if(a === 'minst'){ var o = saved[+b.dataset.i]; install(o.n, urlFor(o)); }
      else if(a === 'mdel'){ saved.splice(+b.dataset.i, 1); store('lbs-custom', saved); $('mine').innerHTML = mineHtml(); pushPrefs(); toast('Removed from this list. Data already synced stays in your account.'); }
      else if(a === 'make'){
        var n = (cs.n || '').replace(/[<>"&]/g, '').replace(/\s*logbook\s*$/i, '').trim();
        if(!n){ $('cerr').textContent = 'Give it a name first.'; return; }
        if(!cs.b.length){ $('cerr').textContent = 'Pick at least one thing to log.'; return; }
        $('cerr').textContent = ''; var o2 = { k:rid(), n:n.slice(0, 22), a:cs.a.toUpperCase(), b:cs.b.slice() };
        saved.unshift(o2); store('lbs-custom', saved); $('mine').innerHTML = mineHtml(); pushPrefs(); install(o2.n, urlFor(o2));
      }
      else if(a === 'dl'){ var rr = appRow(b.dataset.app); if(!rr) return; var l = document.createElement('a'); l.href = URL.createObjectURL(new Blob([JSON.stringify(rr.data, null, 2)], { type:'application/json' })); l.download = rr.app + '-' + ymd(new Date()) + '.json'; document.body.appendChild(l); l.click(); l.remove(); }
      return;
    }
    var sw = e.target.closest('#csw [data-c]'); if(sw){ cs.a = sw.dataset.c; [].forEach.call($('csw').querySelectorAll('[data-c]'), function(x){ x.setAttribute('aria-pressed', x === sw); }); pv(); return; }
    var cb = e.target.closest('#cbx [data-b]'); if(cb){ var i = cs.b.indexOf(cb.dataset.b); if(i > -1) cs.b.splice(i, 1); else cs.b.push(cb.dataset.b); cb.setAttribute('aria-pressed', i === -1); pv(); return; }
    var dr = e.target.closest('tr.dr'); if(dr){
      var nx = dr.nextElementSibling; if(nx && nx.classList.contains('dd')){ nx.remove(); return; }
      var r2 = appRow(route().app); if(!r2) return; var tr = document.createElement('tr'); tr.className = 'dd'; tr.innerHTML = '<td colspan="3"><pre>' + esc(JSON.stringify(r2.days[dr.dataset.day], null, 2)) + '</pre></td>'; dr.parentNode.insertBefore(tr, dr.nextSibling);
    }
  });
  document.addEventListener('input', function(e){
    var t = e.target;
    if(t.id === 'cn'){ cs.n = t.value.trim(); pv(); }
    else if(t.id === 'ccol'){ cs.a = t.value.toUpperCase(); [].forEach.call($('csw').querySelectorAll('[data-c]'), function(x){ x.setAttribute('aria-pressed', 'false'); }); pv(); }
    else if(t.id === 'fq'){ filt.q = t.value; var r = appRow(route().app); if(r) $('dtbl').innerHTML = dayTable(r); }
    else if(t.id === 'fm'){ filt.m = t.value; var r3 = appRow(route().app); if(r3) $('dtbl').innerHTML = dayTable(r3); }
  });
  document.addEventListener('submit', function(e){
    if(e.target.id !== 'af') return; e.preventDefault();
    var em = $('ae').value.trim(), pw = $('ap').value; $('aerr').textContent = '';
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ $('aerr').textContent = 'Enter a valid email.'; return; }
    if(pw.length < 8){ $('aerr').textContent = 'Use at least 8 characters for the password.'; return; }
    if(navigator.onLine === false){ $('aerr').textContent = 'You are offline.'; return; }
    $('ab').disabled = true;
    fetch(mode === 'in' ? SB + '/auth/v1/token?grant_type=password' : SB + '/auth/v1/signup', { method:'POST', headers:hdr(), body:JSON.stringify({ email:em, password:pw }) }).then(j).then(function(r){
      if(!r.ok){ $('ab').disabled = false; $('aerr').textContent = emsg(r); return; }
      if(r.j && r.j.access_token){ setSess(r.j); location.hash = '#/'; render(); load(false); pushPrefs(); }
      else { $('ab').disabled = false; $('aerr').textContent = 'Account created. Check your email to confirm it, then sign in.'; }
    }, function(){ $('ab').disabled = false; $('aerr').textContent = 'Could not reach the server. Check your connection.'; });
  });

  render();
  if(sess) load(false);
})();
</script>
</body>
</html>
