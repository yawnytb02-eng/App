/* ============================================================
   CHART TOOLKIT
   Everything the Monthly Tracker draws goes through these
   helpers. Shared rules, so no two charts contradict each other:

     - The x-axis is ALWAYS the whole calendar month (day 1 to the
       last day), never "just the days that happen to have data".
       The old chart rescaled its x-axis to the logged range, so
       three entries on the 1st, 2nd and 3rd stretched across the
       full card and read like a whole month of activity.
     - The y-axis always shows real numbers with real gridlines.
     - Nothing uses preserveAspectRatio="none" (it squashed the
       stroke widths and turned every data dot into an ellipse).
     - Every chart is followed by a stat strip and a plain-English
       note, so the numbers are legible without reading the shape.
     - Colour is never the only carrier of meaning: legends repeat
       the label, the count and the share, and every drawn element
       has a <title> for hover/screen-reader.
   ============================================================ */
const CHART_W = 320;

/* Rounded "nice" axis bounds + tick stops (1 / 2 / 2.5 / 5 / 10
   times a power of ten), so a y-axis reads 0-10-20-30 instead of
   0-8.33-16.67-25. */
function niceScale(min, max, tickCount){
  tickCount = Math.max(2, tickCount || 4);
  if(!isFinite(min)) min = 0;
  if(!isFinite(max)) max = 0;
  if(min === max){
    if(min === 0){ max = 1; }
    else if(min > 0){ min = 0; }
    else { max = 0; }
  }
  const range = (max - min) || 1;
  const rawStep = range / tickCount;
  const mag = Math.pow(10, Math.floor(Math.log10(Math.abs(rawStep) || 1)));
  const norm = rawStep / mag;
  let step;
  if(norm <= 1) step = 1;
  else if(norm <= 2) step = 2;
  else if(norm <= 2.5) step = 2.5;
  else if(norm <= 5) step = 5;
  else step = 10;
  step *= mag;
  const niceMin = Math.floor(min / step) * step;
  const niceMax = Math.ceil(max / step) * step;
  const ticks = [];
  for(let v = niceMin; v <= niceMax + step * 1e-9; v += step) ticks.push(+v.toFixed(10));
  return { min:niceMin, max:niceMax === niceMin ? niceMin + step : niceMax, step, ticks };
}
/* Compact number for axis ticks and stat cards: 1.2k, 18.5k, 3. */
function fmtCompact(n){
  const v = +n || 0;
  const abs = Math.abs(v);
  if(abs >= 1000000) return (v/1000000).toFixed(abs >= 10000000 ? 0 : 1).replace(/\.0$/,'') + 'M';
  if(abs >= 1000) return (v/1000).toFixed(abs >= 10000 ? 0 : 1).replace(/\.0$/,'') + 'k';
  if(Number.isInteger(v)) return String(v);
  return String(+v.toFixed(1));
}
function fmtMoney(n){
  const v = +n || 0;
  return (v < 0 ? '-$' : '$') + fmtCompact(Math.abs(v));
}
function fmtSigned(n){
  const v = +n || 0;
  return (v > 0 ? '+' : '') + fmtCompact(v);
}
/* Which x-axis day numbers get a printed label. Always includes
   day 1 and the last day of the month so the reader can see the
   chart really does cover the whole month. */
function dayTicks(lastDay){
  const out = [1];
  for(let d = 5; d < lastDay; d += 5) if(d > 1) out.push(d);
  if(out[out.length-1] !== lastDay){
    if(lastDay - out[out.length-1] < 3) out.pop();
    out.push(lastDay);
  }
  return out;
}

/* One card shell for every chart, so spacing, the unit badge, the
   stat strip and the footnote are identical everywhere. */
function chartCard(o){
  const stats = (o.stats && o.stats.length)
    ? `<div class="chart-stats">${o.stats.map(s=>`
        <div class="chart-stat ${s.tone||''}"><div class="v">${s.v}</div><div class="l">${esc(s.l)}</div></div>
      `).join('')}</div>`
    : '';
  return `
    <div class="chart-card">
      <div class="chart-head">
        <div>
          <div class="chart-title">${esc(o.title)}</div>
          ${o.sub ? `<div class="chart-sub">${esc(o.sub)}</div>` : ''}
        </div>
        ${o.unit ? `<div class="chart-unit">${esc(o.unit)}</div>` : ''}
      </div>
      ${stats}
      ${o.body}
      ${o.legend || ''}
      ${o.note ? `<div class="chart-note">${o.note}</div>` : ''}
    </div>`;
}
function chartEmpty(text){ return `<div class="chart-empty">${esc(text)}</div>`; }

/* ------------------------------------------------------------
   DAY HEATMAP — calendar-grid alternative to the bar chart, in
   the style of a token-usage or contribution graph: one cell per
   day of the month, shaded by that day's value on a 5-step scale
   (0 = no data, 1-4 = quartiles of this month's own range), not a
   bar's height. Same points shape as renderDaySeriesChart
   ([{date,value}]) and the same monthKey/fmt/color/label options,
   so a chart can switch between the two without reshaping its data.
   ------------------------------------------------------------ */
/* ------------------------------------------------------------
   Shared by both heatmaps below (month grid + year strip): turns
   a colour into the same 4-step lightness ramp, and a list of
   values into quartile break points computed from the data's own
   range rather than a fixed ceiling. Factored out so the year
   strip can't silently drift from the month grid's shading rules
   — same inputs always produce the same 5 levels, whichever chart
   is asking. */
function heatmapRamp(color){
  return [
    null,
    `color-mix(in srgb, ${color} 22%, var(--surface-2))`,
    `color-mix(in srgb, ${color} 46%, var(--surface-2))`,
    `color-mix(in srgb, ${color} 72%, var(--surface-2))`,
    color,
  ];
}
function heatmapLevels(values){
  const sortedVals = [...values].filter(v=>v>0).sort((a,b)=>a-b);
  const qAt = f => sortedVals.length ? sortedVals[Math.min(sortedVals.length-1, Math.floor(f*(sortedVals.length-1)))] : 0;
  const q1 = qAt(0.25), q2 = qAt(0.5), q3 = qAt(0.75);
  return {
    sortedVals,
    max: sortedVals.length ? sortedVals[sortedVals.length-1] : 0,
    levelFor: v => {
      if(v <= 0) return 0;
      if(v <= q1) return 1;
      if(v <= q2) return 2;
      if(v <= q3) return 3;
      return 4;
    },
  };
}
const HEATMAP_INK_ON_STRONG = ['','var(--ink)','var(--ink)','#fff','#fff'];

function renderDayHeatmap(points, opts){
  opts = opts || {};
  const mk = opts.monthKey || currentMonthKey();
  const n = daysInMonth(mk);
  const fmt = opts.fmt || (v=>fmtCompact(v));
  if(!points || !points.length) return chartEmpty(opts.emptyText || 'Nothing logged this month yet.');

  const byDate = {};
  points.forEach(p=>{ byDate[p.date] = +p.value || 0; });
  const { sortedVals, max, levelFor } = heatmapLevels(points.map(p=>+p.value||0));
  const color = opts.color || 'var(--accent)';
  const RAMP = heatmapRamp(color);

  const first = new Date(mk+'-01T00:00:00');
  const startOffset = (first.getDay()+6)%7;
  const todayDs = todayStr();
  let cells = '';
  for(let i=0;i<startOffset;i++) cells += `<div class="dh-cell dh-empty"></div>`;
  for(let day=1; day<=n; day++){
    const ds = `${mk}-${String(day).padStart(2,'0')}`;
    const isFuture = ds > todayDs;
    const has = Object.prototype.hasOwnProperty.call(byDate, ds);
    const v = byDate[ds] || 0;
    const level = has ? levelFor(v) : 0;
    const style = level>0 ? `style="background:${RAMP[level]}; color:${HEATMAP_INK_ON_STRONG[level]};"` : '';
    const label = has ? `${ds}: ${fmt(v)}` : (isFuture ? ds : `${ds}: nothing logged`);
    cells += `<button class="dh-cell dh-${level} ${isFuture?'dh-future':''}" ${style} onclick="${isFuture?'':`selectDate('${ds}'); nav('home')`}" title="${esc(label)}">${day}</button>`;
  }
  const dows = ['M','T','W','T','F','S','S'];
  const legendSteps = [0,1,2,3,4];
  const scaleLabel = sortedVals.length
    ? `${fmt(sortedVals[0])} → ${fmt(max)}`
    : 'no data';

  const ariaSummary = `${esc(opts.label||opts.title||'Daily values')} across ${monthLabel(mk)}, shown as a calendar heatmap: ${points.length} day${points.length===1?'':'s'} logged, from ${sortedVals.length?fmt(sortedVals[0]):'0'} to ${fmt(max)}.`;

  return `<div role="img" aria-label="${esc(ariaSummary)}">
    <div class="dh-grid">${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>
    <div class="dh-legend">
      <span>Less</span>
      <span class="dh-legend-scale">${legendSteps.map(l=>`<span class="dh-chip" style="background:${l===0?'var(--surface-2)':RAMP[l]};"></span>`).join('')}</span>
      <span>More</span>
      <span style="margin-left:auto;">${esc(scaleLabel)}</span>
    </div>
  </div>`;
}

/* ------------------------------------------------------------
   YEAR HEATMAP — the "token usage graph" layout: one column per
   week, one row per weekday (Mon top, Sun bottom), continuous
   across the whole year rather than 12 separate month grids. Same
   shading rules as renderDayHeatmap (heatmapRamp/heatmapLevels),
   same points shape, so the two heatmaps can never visually
   disagree about what "level 3" means for the same kind of value.
   ------------------------------------------------------------ */
function renderYearHeatmap(points, opts){
  opts = opts || {};
  const yk = opts.yearKey || currentYearKey();
  const fmt = opts.fmt || (v=>fmtCompact(v));
  if(!points || !points.length) return chartEmpty(opts.emptyText || 'Nothing logged this year yet.');

  const byDate = {};
  points.forEach(p=>{ byDate[p.date] = +p.value || 0; });
  const { sortedVals, max, levelFor } = heatmapLevels(points.map(p=>+p.value||0));
  const color = opts.color || 'var(--accent)';
  const RAMP = heatmapRamp(color);
  const todayDs = todayStr();

  // Twelve mini month-calendars (Mon-start, blank leading/trailing
  // cells) in a CSS grid. One grid, one set of column tracks
  // (repeat(3,1fr) on phone, repeat(6,1fr) from 720px — see the CSS),
  // never a flex row of fixed-width children: a flex row sized by
  // its children's natural width is exactly what produced the
  // previous version's bug — 12 month-bands whose combined natural
  // width (~710px) was wider than the card holding them (~688px)
  // even on a comfortable desktop width, so it either scrolled the
  // whole page sideways or, past a point, forced the card open.
  // Grid tracks are computed from the *container's* width, not the
  // content's, so this cannot happen again regardless of viewport.
  const monthsHtml = Array.from({length:12}, (_,mi)=>{
    const mk = `${yk}-${String(mi+1).padStart(2,'0')}`;
    const n = daysInMonth(mk);
    const first = new Date(mk+'-01T00:00:00');
    const startOffset = (first.getDay()+6)%7;
    let cells = '';
    for(let i=0;i<startOffset;i++) cells += `<div class="yh-cell yh-empty"></div>`;
    for(let day=1; day<=n; day++){
      const ds = `${mk}-${String(day).padStart(2,'0')}`;
      const isFuture = ds > todayDs;
      const has = Object.prototype.hasOwnProperty.call(byDate, ds);
      const v = byDate[ds] || 0;
      const level = has ? levelFor(v) : 0;
      const style = level>0 ? `style="background:${RAMP[level]}; color:${HEATMAP_INK_ON_STRONG[level]};"` : '';
      const label = has ? `${fmtDateShort(ds)}: ${fmt(v)}` : (isFuture ? fmtDateShort(ds) : `${fmtDateShort(ds)}: nothing logged`);
      cells += `<button class="yh-cell yh-${level} ${isFuture?'yh-future':''}" ${style} onclick="${isFuture?'':`selectDate('${ds}'); nav('home')`}" title="${esc(label)}" aria-label="${esc(label)}"></button>`;
    }
    const trailing = (startOffset + n) % 7;
    if(trailing) for(let i=trailing; i<7; i++) cells += `<div class="yh-cell yh-empty"></div>`;
    return `<div class="yh-month">
      <div class="yh-month-name">${first.toLocaleDateString('en-US',{month:'short'})}</div>
      <div class="yh-month-grid">${cells}</div>
    </div>`;
  }).join('');

  const activeDays = sortedVals.length;
  const scaleLabel = sortedVals.length ? `${fmt(sortedVals[0])} → ${fmt(max)}` : 'no data';
  const ariaSummary = `${esc(opts.label||opts.title||'Daily values')} across ${yk}, shown as a year heatmap: ${activeDays} day${activeDays===1?'':'s'} logged, from ${activeDays?fmt(sortedVals[0]):'0'} to ${fmt(max)}. Tap any day to open and log it.`;

  return `<div role="img" aria-label="${esc(ariaSummary)}">
    <div class="yh-year-grid">${monthsHtml}</div>
    <div class="dh-legend">
      <span>Less</span>
      <span class="dh-legend-scale">${[0,1,2,3,4].map(l=>`<span class="dh-chip" style="background:${l===0?'var(--surface-2)':RAMP[l]};"></span>`).join('')}</span>
      <span>More</span>
      <span style="margin-left:auto;">${esc(scaleLabel)}</span>
    </div>
    <div class="chart-note" style="margin-top:8px;">Tap any day to open it on the Daily Dashboard.</div>
  </div>`;
}

/* ------------------------------------------------------------
   MONTH-SERIES CHART — the Year view's equivalent of the day-series
   chart: one x-slot per calendar month (always all 12, Jan-Dec,
   same "show the whole period even when data is sparse" rule as
   renderDaySeriesChart's whole-month x-axis) instead of one per
   day. Used where a day-level line/bar would be too dense to read
   at year scale — currently just the Business lane, which needs
   the same signed zero-baseline handling at year scale that it
   gets at month scale. points: [{monthKey:'YYYY-MM', value}].
   ------------------------------------------------------------ */
function renderMonthSeriesChart(points, opts){
  opts = opts || {};
  const fmt = opts.fmt || (v=>fmtCompact(v));
  const byMonth = {};
  (points||[]).forEach(p=>{ byMonth[p.monthKey] = (byMonth[p.monthKey]||0) + (+p.value||0); });
  const monthKeys = Array.from({length:12}, (_,i)=> `${opts.yearKey}-${String(i+1).padStart(2,'0')}`);
  const hasAny = monthKeys.some(mk => byMonth[mk] !== undefined);
  if(!hasAny) return chartEmpty(opts.emptyText || 'Nothing logged this year yet.');

  const W = CHART_W, H = opts.height || 152;
  const padL = 34, padR = 10, padT = 14, padB = 22;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  const values = monthKeys.map(mk => byMonth[mk] || 0);
  let dataMin = Math.min(...values), dataMax = Math.max(...values);
  if(opts.yFrom0 !== false) dataMin = Math.min(0, dataMin);
  const scale = niceScale(dataMin, dataMax, opts.tickCount || 4);

  const xFor = i => padL + ((i + 0.5) / 12) * plotW;
  const yFor = v => padT + (1 - ((v - scale.min) / (scale.max - scale.min))) * plotH;

  const grid = scale.ticks.map(t=>`
    <line class="chart-grid-line" x1="${padL}" y1="${yFor(t).toFixed(1)}" x2="${W-padR}" y2="${yFor(t).toFixed(1)}"/>
    <text class="chart-tick" x="${padL-5}" y="${(yFor(t)+3.2).toFixed(1)}" text-anchor="end">${esc(fmtCompact(t))}</text>
  `).join('');
  const zeroY = yFor(0);
  const zeroLine = (scale.min < 0 && scale.max > 0)
    ? `<line class="chart-zero-line" x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${W-padR}" y2="${zeroY.toFixed(1)}"/>` : '';

  const monthInitials = ['J','F','M','A','M','J','J','A','S','O','N','D'];
  const xLabels = monthInitials.map((l,i)=>`<text class="chart-tick" x="${xFor(i).toFixed(1)}" y="${H-7}" text-anchor="middle">${l}</text>`).join('');

  const color = opts.color || 'var(--accent)';
  const slot = plotW / 12;
  const bw = Math.max(6, Math.min(22, slot - 6));
  const series = monthKeys.map((mk,i)=>{
    const has = byMonth[mk] !== undefined;
    if(!has) return '';
    const v = byMonth[mk];
    const x = xFor(i) - bw/2;
    const base = (scale.min < 0 && scale.max > 0) ? zeroY : yFor(scale.min);
    const y = v >= 0 ? yFor(v) : base;
    const h = Math.max(1.5, Math.abs(base - yFor(v)));
    const fill = (v < 0) ? 'var(--muted)' : color;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(3,bw/2).toFixed(1)}" fill="${fill}"><title>${esc(monthLabelShort(mk))}: ${esc(fmt(v))}</title></rect>`;
  }).join('');

  const loggedMonths = monthKeys.filter(mk => byMonth[mk] !== undefined);
  const ariaSummary = `${esc(opts.label||opts.title||'Monthly values')} across ${opts.yearKey}: ${loggedMonths.length} month${loggedMonths.length===1?'':'s'} with activity.`;

  return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(ariaSummary)}">
    ${grid}
    ${zeroLine}
    ${series}
    <line class="chart-grid-line" x1="${padL}" y1="${(padT+plotH).toFixed(1)}" x2="${W-padR}" y2="${(padT+plotH).toFixed(1)}"/>
    ${xLabels}
  </svg>`;
}

/* ------------------------------------------------------------
   DAY-SERIES CHART — line or bars, one x-slot per calendar day.
   points: [{date:'YYYY-MM-DD', value:Number}] (sparse is fine)
   opts: { monthKey, type:'line'|'bar', fmt, yFrom0, yMax, avg,
           color, label }
   ------------------------------------------------------------ */
function renderDaySeriesChart(points, opts){
  opts = opts || {};
  const mk = opts.monthKey || currentMonthKey();
  const lastDay = daysInMonth(mk);
  const fmt = opts.fmt || (v=>fmtCompact(v));
  if(!points || !points.length) return chartEmpty(opts.emptyText || 'Nothing logged this month yet.');

  const W = CHART_W, H = opts.height || 152;
  const padL = 34, padR = 10, padT = 14, padB = 22;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  const values = points.map(p=>+p.value || 0);
  let dataMin = Math.min(...values), dataMax = Math.max(...values);
  if(opts.yFrom0 !== false) dataMin = Math.min(0, dataMin);
  if(opts.yMax != null) dataMax = Math.max(dataMax, opts.yMax);
  const scale = niceScale(dataMin, dataMax, opts.tickCount || 4);

  const xFor = d => padL + ((d - 0.5) / lastDay) * plotW;
  const yFor = v => padT + (1 - ((v - scale.min) / (scale.max - scale.min))) * plotH;

  const grid = scale.ticks.map(t=>`
    <line class="chart-grid-line" x1="${padL}" y1="${yFor(t).toFixed(1)}" x2="${W-padR}" y2="${yFor(t).toFixed(1)}"/>
    <text class="chart-tick" x="${padL-5}" y="${(yFor(t)+3.2).toFixed(1)}" text-anchor="end">${esc(fmtCompact(t))}</text>
  `).join('');

  const zeroY = yFor(0);
  const zeroLine = (scale.min < 0 && scale.max > 0)
    ? `<line class="chart-zero-line" x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${W-padR}" y2="${zeroY.toFixed(1)}"/>` : '';

  // The caption sits bottom-right, so drop any day tick that would
  // collide with it rather than printing two labels on top of each other.
  const captionX = W - padR - 58;
  const xLabels = dayTicks(lastDay).filter(d=>xFor(d) < captionX).map(d=>`
    <text class="chart-tick" x="${xFor(d).toFixed(1)}" y="${H-7}" text-anchor="middle">${d}</text>
  `).join('');

  const sorted = [...points].sort((a,b)=> a.date.localeCompare(b.date));
  const avg = values.reduce((s,v)=>s+v,0) / values.length;
  const avgLine = (opts.avg === false) ? '' : `
    <line class="chart-avg-line" x1="${padL}" y1="${yFor(avg).toFixed(1)}" x2="${W-padR}" y2="${yFor(avg).toFixed(1)}"/>
    <text class="chart-tick" x="${W-padR}" y="${(yFor(avg)-4).toFixed(1)}" text-anchor="end">avg ${esc(fmt(+avg.toFixed(1)))}</text>`;

  const color = opts.color || 'var(--accent)';
  let series = '';

  if(opts.type === 'bar'){
    const slot = plotW / lastDay;
    const bw = Math.max(2.5, Math.min(9, slot - 1.6));
    series = sorted.map(p=>{
      const v = +p.value || 0;
      const x = xFor(+p.date.slice(-2)) - bw/2;
      const base = (scale.min < 0 && scale.max > 0) ? zeroY : yFor(scale.min);
      const y = v >= 0 ? yFor(v) : base;
      const h = Math.max(1.5, Math.abs(base - yFor(v)));
      const fill = (v < 0) ? 'var(--muted)' : color;
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(2.5,bw/2).toFixed(1)}" fill="${fill}"><title>${esc(fmtDateShort(p.date))}: ${esc(fmt(v))}</title></rect>`;
    }).join('');
  } else {
    const pts = sorted.map(p=>`${xFor(+p.date.slice(-2)).toFixed(1)},${yFor(+p.value||0).toFixed(1)}`);
    const baseY = (scale.min < 0 && scale.max > 0) ? zeroY : yFor(scale.min);
    const area = `${xFor(+sorted[0].date.slice(-2)).toFixed(1)},${baseY.toFixed(1)} ${pts.join(' ')} ${xFor(+sorted[sorted.length-1].date.slice(-2)).toFixed(1)},${baseY.toFixed(1)}`;
    const dots = sorted.map(p=>`
      <circle cx="${xFor(+p.date.slice(-2)).toFixed(1)}" cy="${yFor(+p.value||0).toFixed(1)}" r="2.8"
        fill="${color}" stroke="var(--surface)" stroke-width="1.4"><title>${esc(fmtDateShort(p.date))}: ${esc(fmt(+p.value||0))}</title></circle>`).join('');
    series = `
      <polygon points="${area}" fill="${color}" opacity="0.13"/>
      <polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}`;
  }

  const best = sorted.reduce((a,b)=> (+b.value||0) > (+a.value||0) ? b : a, sorted[0]);
  const bestX = xFor(+best.date.slice(-2));
  const bestLabel = `
    <text class="chart-callout" x="${Math.min(W-padR-2, Math.max(padL+16, bestX)).toFixed(1)}" y="${Math.max(9, yFor(+best.value||0) - 7).toFixed(1)}"
      text-anchor="${bestX > W-70 ? 'end' : (bestX < padL+30 ? 'start' : 'middle')}">${esc(fmt(+best.value||0))}</text>`;

  const ariaSummary = `${esc(opts.label || opts.title || 'Daily values')} across ${monthLabel(mk)}: ${points.length} day${points.length===1?'':'s'} logged, average ${fmt(+avg.toFixed(1))}, highest ${fmt(+best.value||0)} on ${fmtDateShort(best.date)}.`;

  return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(ariaSummary)}">
    ${grid}
    ${zeroLine}
    ${series}
    ${avgLine}
    ${opts.showBest === false ? '' : bestLabel}
    <line class="chart-grid-line" x1="${padL}" y1="${(padT+plotH).toFixed(1)}" x2="${W-padR}" y2="${(padT+plotH).toFixed(1)}"/>
    ${xLabels}
    <text class="chart-axis-label" x="${W-padR}" y="${H-7}" text-anchor="end" opacity="0.75">day of month</text>
  </svg>`;
}

/* ------------------------------------------------------------
   DONUT — part-to-whole for mood / session type. Never shown on
   its own: always paired with a legend carrying label + count +
   share, because slices alone can't be compared accurately.
   ------------------------------------------------------------ */
function donutArcPath(cx, cy, rOut, rIn, a0, a1){
  const pol = (r,deg)=>{ const rad=(deg-90)*Math.PI/180; return [cx+r*Math.cos(rad), cy+r*Math.sin(rad)]; };
  const large = (a1-a0) > 180 ? 1 : 0;
  const [x0,y0] = pol(rOut,a0), [x1,y1] = pol(rOut,a1);
  const [x2,y2] = pol(rIn,a1),  [x3,y3] = pol(rIn,a0);
  return `M${x0.toFixed(2)},${y0.toFixed(2)} A${rOut},${rOut} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)} `
       + `L${x2.toFixed(2)},${y2.toFixed(2)} A${rIn},${rIn} 0 ${large} 0 ${x3.toFixed(2)},${y3.toFixed(2)} Z`;
}
/* entries: [{label, count, color}] */
function renderDonut(entries, opts){
  opts = opts || {};
  const total = entries.reduce((s,e)=>s+e.count,0);
  if(!total) return chartEmpty(opts.emptyText || 'Nothing logged this month yet.');
  const S = 150, cx = S/2, cy = S/2, rOut = 62, rIn = 40;

  let angle = 0;
  const slices = entries.filter(e=>e.count>0).map(e=>{
    const sweep = (e.count/total) * 360;
    const a0 = angle, a1 = angle + sweep;
    angle = a1;
    const pct = Math.round((e.count/total)*100);
    // A single category would otherwise be a zero-length arc (start
    // angle === end angle) and draw nothing — split it into halves.
    if(sweep >= 359.999){
      return `<path d="${donutArcPath(cx,cy,rOut,rIn,0,180)}" fill="${e.color}"><title>${esc(e.label)}: ${e.count} (${pct}%)</title></path>`
           + `<path d="${donutArcPath(cx,cy,rOut,rIn,180,360)}" fill="${e.color}"></path>`;
    }
    return `<path d="${donutArcPath(cx,cy,rOut,rIn,a0,a1)}" fill="${e.color}" stroke="var(--surface)" stroke-width="1.5"><title>${esc(e.label)}: ${e.count} (${pct}%)</title></path>`;
  }).join('');

  const aria = `${esc(opts.label||'Breakdown')}: ` + entries.filter(e=>e.count>0)
    .map(e=>`${e.label} ${e.count} (${Math.round((e.count/total)*100)}%)`).join(', ');

  return `<div style="display:flex; align-items:center; justify-content:center;">
    <svg class="chart-svg" viewBox="0 0 ${S} ${S}" style="max-width:168px;" role="img" aria-label="${esc(aria)}">
      ${slices}
      <text x="${cx}" y="${cy-2}" text-anchor="middle" style="font-family:var(--font-display); font-size:26px; font-weight:800; fill:var(--ink);">${total}</text>
      <text x="${cx}" y="${cy+14}" text-anchor="middle" class="chart-tick">${esc(opts.centerLabel||'entries')}</text>
    </svg>
  </div>`;
}
function renderLegend(entries){
  const total = entries.reduce((s,e)=>s+e.count,0) || 1;
  return `<div class="chart-legend">${entries.filter(e=>e.count>0).map(e=>`
    <div class="legend-row">
      <span class="legend-swatch" style="background:${e.color}"></span>
      <span class="legend-label">${esc(e.label)}</span>
      <span class="legend-val">${e.count}</span>
      <span class="legend-pct">${Math.round((e.count/total)*100)}%</span>
    </div>`).join('')}</div>`;
}
/* Horizontal labelled bars — for breakdowns where the ordering
   matters more than the share (mental state), and for progress
   bullets (objectives). */
function renderBarBreakdown(entries, opts){
  opts = opts || {};
  if(!entries.length) return chartEmpty(opts.emptyText || 'Nothing logged this month yet.');
  const max = Math.max(...entries.map(e=>e.count), 1);
  const total = entries.reduce((s,e)=>s+e.count,0) || 1;
  return `<div class="bar-breakdown">${entries.map(e=>`
    <div class="bb-row">
      <div class="bb-label" title="${esc(e.label)}">${esc(e.label)}</div>
      <div class="bb-track"><div class="bb-fill" style="width:${Math.max(3,Math.round((e.count/max)*100))}%; background:${e.color||'var(--accent)'};"></div></div>
      <div class="bb-count">${opts.fmt ? esc(opts.fmt(e.count)) : e.count}${opts.hidePct ? '' : `<span class="pct">${Math.round((e.count/total)*100)}%</span>`}</div>
    </div>`).join('')}</div>`;
}

/* ============================================================
   MONTH SUMMARY VIEW — one scrollable report per month.
   ============================================================ */
let SUMMARY_MONTH = null;
let SUMMARY_YEAR = null;
function renderHeatmap(monthKey, heat){
  const n = daysInMonth(monthKey);
  const first = new Date(monthKey+'-01T00:00:00');
  const startOffset = (first.getDay()+6)%7;
  const todayDs = todayStr();
  let cells = '';
  for(let i=0;i<startOffset;i++) cells += `<div class="heat-cell heat-cell-empty"></div>`;
  for(let day=1; day<=n; day++){
    const ds = `${monthKey}-${String(day).padStart(2,'0')}`;
    const count = heat[ds]||0;
    const level = count===0?0 : count<2?1 : count<4?2 : 3;
    const isFuture = ds > todayDs;
    cells += `<button class="heat-cell lvl${level} ${isFuture?'future':''}" onclick="${isFuture?'':`selectDate('${ds}'); nav('home')`}" title="${ds}: ${count} page${count===1?'':'s'} logged">${day}</button>`;
  }
  const dows = ['M','T','W','T','F','S','S'];
  // The old legend was a bare "Less ... More" ramp, which never said
  // what a shade actually meant. Each step now states its own range.
  const scale = [
    ['lvl0','0 pages'], ['lvl1','1'], ['lvl2','2-3'], ['lvl3','4+'],
  ];
  return `<div class="cal-grid heat-grid">${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>
    <div class="heat-scale">
      ${scale.map(([cls,label])=>`<span class="heat-scale-item"><span class="heat-cell heat-scale-chip ${cls}"></span>${esc(label)}</span>`).join('')}
      <span class="heat-scale-item" style="margin-left:auto;">Tap a day to open it</span>
    </div>`;
}

function shiftSummaryMonth(delta){
  const mk = SUMMARY_MONTH || currentMonthKey();
  const [y,m] = mk.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  SUMMARY_MONTH = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  render();
}
function shiftSummaryYear(delta){
  const yk = SUMMARY_YEAR || currentYearKey();
  SUMMARY_YEAR = String(+yk + delta);
  render();
}

/* Monthly Tracker: a pure report on what's already been logged —
   a Month view (day-level charts for whichever month you're on)
   and a Year view (the same shape, one level up). Nothing here is
   filled in on this screen; Bucket List / Income / Objectives are
   standalone pages reached from Home's Setup tiles (see
   PAGE_RENDERERS) precisely so this screen never mixes "things to
   read" with "things to fill in". Tab state is module-level like
   HOME_REST_OPEN — cheap, and it's fine for it to reset on a full
   page reload. */
let TRACKER_PERIOD = 'month';
function setTrackerPeriod(period){
  TRACKER_PERIOD = period;
  render();
}
function renderTracker(){
  const periodTabs = [
    { id:'month', label:'Month' },
    { id:'year',  label:'Year' },
  ];
  const tabBar = `<div class="tracker-tabs">${periodTabs.map(t=>`
    <button class="tracker-tab ${TRACKER_PERIOD===t.id?'active':''}" onclick="setTrackerPeriod('${t.id}')">${esc(t.label)}</button>
  `).join('')}</div>`;

  let nav_, body;
  if(TRACKER_PERIOD === 'year'){
    const yearKey = SUMMARY_YEAR || currentYearKey();
    SUMMARY_YEAR = yearKey;
    const isCurrentYear = yearKey === currentYearKey();
    nav_ = `
      <div class="month-nav">
        <button onclick="shiftSummaryYear(-1)" aria-label="Previous year">${icon('chevleft',16)}</button>
        <div class="month-nav-label">${esc(yearKey)}</div>
        <button onclick="shiftSummaryYear(1)" ${isCurrentYear?'disabled style="opacity:0.3;"':''} aria-label="Next year">${icon('chevright',16)}</button>
      </div>`;
    body = renderTrackerYear(yearKey);
  } else {
    const monthKey = SUMMARY_MONTH || currentMonthKey();
    SUMMARY_MONTH = monthKey;
    const isCurrentMonth = monthKey === currentMonthKey();
    nav_ = `
      <div class="month-nav">
        <button onclick="shiftSummaryMonth(-1)" aria-label="Previous month">${icon('chevleft',16)}</button>
        <div class="month-nav-label">${monthLabel(monthKey)}</div>
        <button onclick="shiftSummaryMonth(1)" ${isCurrentMonth?'disabled style="opacity:0.3;"':''} aria-label="Next month">${icon('chevright',16)}</button>
      </div>`;
    body = renderTrackerOverview(monthKey);
  }

  app.innerHTML = `
    ${renderTopbar('Tracker', false)}
    ${tabBar}
    ${nav_}
    ${body}
    <div class="gap-block"></div>
    ${renderBottomNav('tracker')}
  `;
}

function renderTrackerOverview(monthKey){
  const s = computeMonthSummary(monthKey);
  const isCurrent = monthKey === currentMonthKey();
  const pct = s.daysElapsed ? Math.round((s.daysLogged/s.daysElapsed)*100) : 0;
  const prevPct = s.prev && s.prev.daysElapsed ? Math.round((s.prev.daysLogged/s.prev.daysElapsed)*100) : null;
  const deltaPct = prevPct===null ? null : pct - prevPct;
  const periodWord = isCurrent ? `${s.daysElapsed} days in so far` : `all ${s.daysInMonth} days`;

  /* ---- 1. Headline KPIs ------------------------------------ */
  const kpis = `
    <div class="tracker-kpi-grid">
      <div class="tracker-kpi">
        <div class="v">${s.daysLogged}<span class="unit">/${s.daysElapsed}</span></div>
        <div class="l">Days logged</div>
        <div class="s">${s.daysElapsed - s.daysLogged} missed ${isCurrent?'so far':'this month'}</div>
      </div>
      <div class="tracker-kpi">
        <div class="v">${pct}<span class="unit">%</span>${deltaPct===null?'':`<span class="delta ${deltaPct>=0?'up':'down'}">${deltaPct>0?'+':''}${deltaPct}</span>`}</div>
        <div class="l">Consistency</div>
        <div class="s">${prevPct===null ? 'No previous month to compare' : `Last month: ${prevPct}%`}</div>
      </div>
      <div class="tracker-kpi">
        <div class="v">${s.bestStreak}<span class="unit">d</span></div>
        <div class="l">Longest streak</div>
        <div class="s">Best unbroken run inside ${monthLabelShort(monthKey)}</div>
      </div>
      <div class="tracker-kpi">
        <div class="v">${s.avgRating!==null? s.avgRating.toFixed(1) : '—'}${s.avgRating!==null?'<span class="unit">/5</span>':''}</div>
        <div class="l">Avg energy</div>
        <div class="s">${s.ratingTrend.length ? `From ${s.ratingTrend.length} logged day${s.ratingTrend.length===1?'':'s'}` : 'No energy logged yet'}</div>
      </div>
    </div>`;

  /* ---- 2. Consistency heatmap ------------------------------ */
  const totalPagesLogged = Object.values(s.heat).reduce((a,b)=>a+b,0);
  const consistency = chartCard({
    title:'Consistency',
    sub:`One square per day of ${monthLabel(monthKey)}. Shade = how many pages you filled in that day.`,
    unit:'pages / day',
    stats:[
      { v:`${s.daysLogged}/${s.daysElapsed}`, l:'Days logged' },
      { v:`${pct}%`, l:'Hit rate' },
      { v:s.daysLogged ? (totalPagesLogged/s.daysLogged).toFixed(1) : '0', l:'Pages per active day' },
    ],
    body: renderHeatmap(monthKey, s.heat),
    note:`<b>${totalPagesLogged}</b> page entries across <b>${s.daysLogged}</b> day${s.daysLogged===1?'':'s'}, out of ${periodWord}.`,
  });

  /* ---- 3. Energy trend --------------------------------- */
  const ratingBest = s.ratingBest, ratingWorst = s.ratingWorst;
  const ratingChart = chartCard({
    title:'Energy',
    sub:'How much energy you logged each day, on Food & Fuel.',
    unit:'score /5',
    stats:[
      { v: s.avgRating!==null ? s.avgRating.toFixed(1) : '—', l:'Average' },
      { v: ratingBest ? `${ratingBest.value}/5` : '—', l: ratingBest ? `Best · ${fmtDateShort(ratingBest.date)}` : 'Best day' },
      { v: ratingWorst ? `${ratingWorst.value}/5` : '—', l: ratingWorst ? `Low · ${fmtDateShort(ratingWorst.date)}` : 'Lowest day' },
    ],
    body: renderDaySeriesChart(s.ratingTrend, {
      monthKey, type:'line', yFrom0:true, yMax:5, tickCount:5, color:'var(--accent)',
      fmt:v=>v+'/5', label:'Energy',
      emptyText:'No energy logged yet. Log it on Food & Fuel and it lands here.',
    }),
    note: s.ratingTrend.length
      ? `Logged on <b>${s.ratingTrend.length}</b> of ${s.daysElapsed} day${s.daysElapsed===1?'':'s'}. Dashed line is the monthly average (<b>${s.avgRating.toFixed(1)}</b>).`
      : '',
  });

  /* ---- 4. Hydration ------------------------------------- */
  const prChart = chartCard({
    title:'Hydration',
    sub:'Cups logged on Food & Fuel each day — darker means more.',
    unit:'cups / 10',
    stats:[
      { v:s.hydrationDays ? Math.round(s.hydrationSum/s.hydrationDays) : '—', l:'Avg cups/day' },
      { v:s.hydrationDays, l:'Days logged' },
      { v:s.hydrationPerfectDays, l:'Days at 10/10' },
    ],
    body: renderDayHeatmap(s.hydrationTrend, {
      monthKey, color:'var(--ch4)',
      fmt:v=>v+' of 10', label:'Cups of water',
      emptyText:'No hydration logged yet. Log it on Food & Fuel.',
    }),
    note: s.hydrationTrend.length
      ? `<b>${s.hydrationPerfectDays}</b> day${s.hydrationPerfectDays===1?'':'s'} at the full 10, <b>${s.hydrationDays}</b> logged in total.`
      : '',
  });

  /* ---- 5. Reading ------------------------------------------ */
  const readingChart = chartCard({
    title:'Daily reading',
    sub:'Pages logged each day on Reading — darker means more pages.',
    unit:'pages / day',
    stats:[
      { v:fmtCompact(s.pagesReadSum), l:'Pages this month' },
      { v:s.readingDays ? Math.round(s.pagesReadSum/s.readingDays) : 0, l:'Avg per reading day' },
      { v:s.readingBest ? `${s.readingBest.value}` : '0', l: s.readingBest ? `Best · ${fmtDateShort(s.readingBest.date)}` : 'Best day' },
    ],
    body: renderDayHeatmap(s.readingTrend, {
      monthKey, color:'var(--ch3)',
      fmt:v=>v+' pages', label:'Pages read',
      emptyText:'No reading logged yet this month.',
    }),
    note: s.readingTrend.length
      ? `Read on <b>${s.readingDays}</b> of ${s.daysElapsed} day${s.daysElapsed===1?'':'s'} · <b>${fmtCompact(s.minutesSum)}</b> minutes total · roughly <b>${s.daysElapsed ? (s.pagesReadSum/s.daysElapsed).toFixed(1) : 0}</b> pages per calendar day.`
      : '',
  });

  /* ---- 6. Workout ------------------------------------------ */
  const typeEntries = WORKOUT_TYPES
    .map((t,i)=>({ label:t, count:s.workoutTypeCount[t]||0, color:`var(--ch${(i%6)+1})` }))
    .filter(e=>e.count>0);
  const workoutChart = chartCard({
    title:'Training',
    sub:'Steps logged per day — darker means more steps — plus what kind of session each workout was.',
    unit:'steps / day',
    stats:[
      { v:s.workoutCount, l:'Sessions logged' },
      { v:fmtCompact(s.stepsSum), l:'Total steps' },
      { v:s.sleepCount ? (s.sleepSum/s.sleepCount).toFixed(1)+'h' : '—', l:'Avg sleep' },
    ],
    body: renderDayHeatmap(s.stepsTrend, {
      monthKey, color:'var(--ch2)',
      fmt:v=>fmtCompact(v)+' steps', label:'Steps',
      emptyText:'No steps logged yet this month.',
    }),
    legend: typeEntries.length ? `
      <div class="chart-note" style="margin-bottom:2px;"><b>Session types</b></div>
      ${renderBarBreakdown(typeEntries, { hidePct:false })}` : '',
    note: s.workoutCount
      ? `Trained on <b>${s.workoutCount}</b> of ${s.daysElapsed} day${s.daysElapsed===1?'':'s'} (<b>${Math.round((s.workoutCount/Math.max(1,s.daysElapsed))*100)}%</b>).`
      : '',
  });

  return `
    ${kpis}
    ${consistency}
    ${ratingChart}
    ${prChart}
    ${readingChart}
    ${workoutChart}
  `;
}

function renderTrackerYear(yearKey){
  const s = computeYearSummary(yearKey);
  const isCurrent = yearKey === currentYearKey();
  const pct = s.daysElapsed ? Math.round((s.daysLogged/s.daysElapsed)*100) : 0;
  const periodWord = isCurrent ? `${s.daysElapsed} days in so far` : `all ${s.daysInYear} days`;

  /* ---- 1. Headline KPIs ------------------------------------ */
  const kpis = `
    <div class="tracker-kpi-grid">
      <div class="tracker-kpi">
        <div class="v">${s.daysLogged}<span class="unit">/${s.daysElapsed}</span></div>
        <div class="l">Days logged</div>
        <div class="s">${s.daysElapsed - s.daysLogged} missed ${isCurrent?'so far':'this year'}</div>
      </div>
      <div class="tracker-kpi">
        <div class="v">${pct}<span class="unit">%</span>${s.prevYearRate===null?'':`<span class="delta ${pct-s.prevYearRate>=0?'up':'down'}">${pct-s.prevYearRate>0?'+':''}${pct-s.prevYearRate}</span>`}</div>
        <div class="l">Consistency</div>

      </div>
      <div class="tracker-kpi">
        <div class="v">${s.bestStreak}<span class="unit">d</span></div>
        <div class="l">Longest streak</div>
        <div class="s">Best unbroken run inside ${yearKey}</div>
      </div>
      <div class="tracker-kpi">

    unit:'pages / day',
    stats:[
      { v:`${s.daysLogged}/${s.daysElapsed}`, l:'Days logged' },
      { v:`${pct}%`, l:'Hit rate' },
      { v: bestMonthLabel || '—', l:'Strongest month' },
    ],
    body: renderYearHeatmap(heatPoints, { yearKey, color:'var(--accent)', fmt:v=>v+(v===1?' page':' pages'), label:'Pages logged' }),
    note:`<b>${totalPagesLogged}</b> page entries across <b>${s.daysLogged}</b> day${s.daysLogged===1?'':'s'}, out of ${periodWord}.`,
  });

  /* ---- 3. Energy trend — one point per logged day -------- */
  const ratingBest = s.ratingBest, ratingWorst = s.ratingWorst;
  const ratingChart = chartCard({
    title:'Energy',
    sub:'How much energy you logged each day, on Food & Fuel.',
    unit:'score /5',
    stats:[
      { v: s.avgRating!==null ? s.avgRating.toFixed(1) : '—', l:'Average' },
      { v: ratingBest ? `${ratingBest.value}/5` : '—', l: ratingBest ? `Best · ${fmtDateShort(ratingBest.date)}` : 'Best day' },
      { v: ratingWorst ? `${ratingWorst.value}/5` : '—', l: ratingWorst ? `Low · ${fmtDateShort(ratingWorst.date)}` : 'Lowest day' },
    ],
    body: renderYearHeatmap(s.ratingTrend, { yearKey, color:'var(--accent)', fmt:v=>v+'/5', label:'Energy', emptyText:'No energy logged yet this year.' }),
    note: s.ratingTrend.length
      ? `Logged on <b>${s.ratingTrend.length}</b> of ${s.daysElapsed} day${s.daysElapsed===1?'':'s'} this year.`
      : '',
  });

  /* ---- 4. Hydration ----------------------------------- */
  const prChart = chartCard({
    title:'Hydration',
    sub:'Cups logged on Food & Fuel each day — darker means more.',
    unit:'cups / 10',
    stats:[
      { v:s.hydrationDays ? Math.round(s.hydrationSum/s.hydrationDays) : '—', l:'Avg cups/day' },
      { v:s.hydrationDays, l:'Days logged' },
      { v:s.hydrationPerfectDays, l:'Days at 10/10' },
    ],
    body: renderYearHeatmap(s.priorityTrend, { yearKey, color:'var(--ch4)', fmt:v=>v+' of 10', label:'Cups of water', emptyText:'No hydration logged yet this year.' }),
    note: s.priorityTrend.length
      ? `<b>${s.hydrationPerfectDays}</b> day${s.hydrationPerfectDays===1?'':'s'} at the full 10, <b>${s.hydrationDays}</b> logged this year.`
      : '',
  });

  /* ---- 5. Reading --------------------------------------------- */
  const readingChart = chartCard({
    title:'Daily reading',
    sub:'Pages logged each day on Reading — darker means more pages.',
    unit:'pages / day',
    stats:[
      { v:fmtCompact(s.pagesReadSum), l:'Pages this year' },
      { v:s.readingDays ? Math.round(s.pagesReadSum/s.readingDays) : 0, l:'Avg per reading day' },
      { v:s.readingBest ? `${s.readingBest.value}` : '0', l: s.readingBest ? `Best · ${fmtDateShort(s.readingBest.date)}` : 'Best day' },
    ],
    body: renderYearHeatmap(s.readingTrend, { yearKey, color:'var(--ch3)', fmt:v=>v+' pages', label:'Pages read', emptyText:'No reading logged yet this year.' }),
    note: s.readingTrend.length
      ? `Read on <b>${s.readingDays}</b> of ${s.daysElapsed} day${s.daysElapsed===1?'':'s'} · <b>${fmtCompact(s.minutesSum)}</b> minutes total this year.`
      : '',
  });

  /* ---- 6. Training ---------------------------------------------- */
  const typeEntries = WORKOUT_TYPES
    .map((t,i)=>({ label:t, count:s.workoutTypeCount[t]||0, color:`var(--ch${(i%6)+1})` }))
    .filter(e=>e.count>0);
  const workoutChart = chartCard({
    title:'Training',
    sub:'Steps logged per day — darker means more steps — across the whole year.',
    unit:'steps / day',
    stats:[
      { v:s.workoutCount, l:'Sessions logged' },
      { v:fmtCompact(s.stepsSum), l:'Total steps' },
      { v:s.sleepCount ? (s.sleepSum/s.sleepCount).toFixed(1)+'h' : '—', l:'Avg sleep' },
    ],
    body: renderYearHeatmap(s.stepsTrend, { yearKey, color:'var(--ch2)', fmt:v=>fmtCompact(v)+' steps', label:'Steps', emptyText:'No steps logged yet this year.' }),
    legend: typeEntries.length ? `
      <div class="chart-note" style="margin-bottom:2px;"><b>Session types</b></div>
      ${renderBarBreakdown(typeEntries, { hidePct:false })}` : '',
    note: s.workoutCount
      ? `Trained on <b>${s.workoutCount}</b> of ${s.daysElapsed} day${s.daysElapsed===1?'':'s'} this year.`
      : '',
  });

  /* ---- 7. Business lane — month bars, not a day heatmap ------- */
  /* ---- 10. Month-by-month scoreboard ------------------------- */
  // The one thing genuinely unique to the year view rather than a
  // scaled-up month chart: which months actually pulled their
  // weight. Sorted by the calendar, not by rank, so December sits
  // under November the way a person expects when skimming a year.
  const monthRows = s.months
    .filter(ms => ms.daysElapsed > 0)
    .map(ms => ({
      label: monthLabelShort(ms.monthKey),
      count: Math.round((ms.daysLogged/ms.daysElapsed)*100),
      color: ms.monthKey === currentMonthKey() ? 'var(--accent)' : 'var(--ch4)',
    }));
  const monthScoreboard = chartCard({
    title:'Month by month',
    sub:'Consistency hit-rate for each month — this month is highlighted.',
    unit:'% of days',
    body: monthRows.length ? renderBarBreakdown(monthRows, { hidePct:true, fmt:v=>v+'%' }) : chartEmpty('Nothing logged yet this year.'),
    note: bestMonthLabel ? `<b>${esc(bestMonthLabel)}</b> was the most consistent month so far.` : '',
  });

  return `
    ${kpis}
    ${consistency}
    ${monthScoreboard}
    ${ratingChart}
    ${prChart}
    ${readingChart}
    ${workoutChart}
  `;
}

/* ---------- shared field helpers ---------- */
function fieldWrap(label, hint, inner){

/* Locked view for a monthly page that's already been filled in
   for the given month. Shows what was set, plus an explicit
   override so a person can still fix a typo without the page
   nagging them to redo the whole thing every day. Body-only —
   embedded inline as a tab inside the Monthly Tracker, same
   pattern as the daily xxxBody() functions. */
function monthlyLockedBody(summaryHtml, pageId, monthKey){
  const mk = monthKey || currentMonthKey();
  return `
    <div class="locked-banner">
      <div class="locked-icon">${icon('check',18)}</div>

        <div class="locked-title">Done for ${monthLabelShort(mk)}</div>
        <div class="locked-sub">Set on ${new Date(monthlyPageTouchedAt(pageId,mk)).toLocaleDateString('en-US',{month:'short',day:'numeric'})}. Locked until next month.</div>

function unlockMonthlyPage(pageId, monthKey){
  const mk = monthKey || currentMonthKey();
  if(DB.monthly[mk] && DB.monthly[mk]._touched) delete DB.monthly[mk]._touched[pageId];
  saveDB();
  render();
}
/* One tap to carry yesterday's entry on this page forward, for
   daily pages where most fields repeat (session type, market,
   route, platform...). Only shows up when there's actually
   something to copy and today's version is still empty. */
function copyYesterdayBar(dateStr, pageId){
  if(pageIsDone(dateStr,pageId)) return '';
  if(!hasYesterdayData(dateStr,pageId)) return '';
  return `<button type="button" class="copy-yday-btn" onclick="copyFromYesterday('${dateStr}','${pageId}')">${icon('history',13)} Copy yesterday's entry</button>`;
}
function scaleTapper(dateStr, pageId, key, max, val, redAtMax){
  let cells='';
  for(let i=1;i<=max;i++){
    const active = val>=i;
    cells += `<div class="scale-dot ${active?'active':''} ${active&&redAtMax?'red':''}" onclick="setScale('${dateStr}','${pageId}','${key}',${i},${max})">${i}</div>`;
  }
  return `<div class="scale-row">${cells}</div>`;
}
function setScale(dateStr,pageId,key,val,max){
  const p = getPage(dateStr,pageId);
  p[key] = (p[key]===val) ? 0 : val; // tap same value again to clear
  markTouched(dateStr,pageId);
  if(pageId==='reading' && key==='rating') libSyncFromReadingLog(dateStr);
  flashSaved();
  render();
}
function textField(dateStr,pageId,key,placeholder,val){
  return `<input class="textline" placeholder="${esc(placeholder)}" value="${esc(val)}"
    oninput="setText('${dateStr}','${pageId}','${key}',this.value)">`;
}
function setText(dateStr,pageId,key,val){
  const p = getPage(dateStr,pageId);
  p[key]=val;
  markTouched(dateStr,pageId);
  if(pageId==='reading' && (key==='title'||key==='author')) libSyncFromReadingLog(dateStr);
  saveDB();
}
function areaField(dateStr,pageId,key,placeholder,val,cls){
  return `<textarea class="${cls||'freewrite'}" placeholder="${esc(placeholder)}"
    oninput="setText('${dateStr}','${pageId}','${key}',this.value)">${esc(val)}</textarea>`;
}
function pillGroup(dateStr,pageId,key,options,val,colorClass){
  return `<div class="pill-row">${options.map(o=>{
    const active = val===o;
    return `<button class="pill ${active?'active '+(colorClass||''):''}" onclick="setPill('${dateStr}','${pageId}','${key}','${o}')">${esc(o)}</button>`;
  }).join('')}</div>`;
}
function setPill(dateStr,pageId,key,val){
  const p = getPage(dateStr,pageId);
  p[key] = (p[key]===val)?null:val;
  markTouched(dateStr,pageId);
  flashSaved();
  render();
}
function checkRow(dateStr,pageId,key,label){
  const p = getPage(dateStr,pageId);
  const checked = !!(p.checks && p.checks[key]);
  return `<div class="check-row ${checked?'struck':''}">
    <div class="checkbox ${checked?'checked':''}" onclick="toggleCheck('${dateStr}','${pageId}','${key}')">${icon('check',14)}</div>
    <div class="crow-text">${esc(label)}</div>
  </div>`;
}
function toggleCheck(dateStr,pageId,key){
  const p = getPage(dateStr,pageId);
  if(!p.checks) p.checks={};
  p.checks[key] = !p.checks[key];
  markTouched(dateStr,pageId);
  flashSaved();
  render();
}
function counterField(dateStr,pageId,key,val,step,suffix){
  step = step||1;
  return `<div class="counter-row">
    <button class="counter-btn" onclick="bumpCounter('${dateStr}','${pageId}','${key}',-${step})">${icon('minus',16)}</button>
    <input class="counter-val counter-input" inputmode="numeric" pattern="[0-9]*"
      value="${esc(val||0)}"
      oninput="setCounterDirect('${dateStr}','${pageId}','${key}',this.value)"
      onfocus="this.select()">${suffix?`<span class="counter-suffix">${esc(suffix)}</span>`:''}
    <button class="counter-btn" onclick="bumpCounter('${dateStr}','${pageId}','${key}',${step})">${icon('plus',16)}</button>
  </div>`;
}
function bumpCounter(dateStr,pageId,key,delta){
  const p = getPage(dateStr,pageId);
  p[key] = Math.max(0, (p[key]||0) + delta);
  markTouched(dateStr,pageId);
  if(pageId==='reading' && key==='pagesToday'){
    applyPagesTodayToProgress(dateStr);
    libSyncFromReadingLog(dateStr);
  }
  saveDB();
  render();
}
function setCounterDirect(dateStr,pageId,key,rawVal){
  const p = getPage(dateStr,pageId);
  // Strip to digits and keep at most ONE decimal point. The old
  // filter allowed "1.2.3", which unary-plus turns into NaN; that
  // NaN was written straight into the day record and serialised to
  // null by JSON.stringify, quietly wiping the field.
  let cleaned = String(rawVal).replace(/[^0-9.]/g,'');
  const dot = cleaned.indexOf('.');
  if(dot !== -1) cleaned = cleaned.slice(0, dot+1) + cleaned.slice(dot+1).replace(/\./g,'');
  const num = (cleaned === '' || cleaned === '.') ? 0 : parseFloat(cleaned);
  p[key] = isFinite(num) ? Math.max(0, num) : 0;
  markTouched(dateStr,pageId);
  if(pageId==='reading' && key==='pagesToday'){
    applyPagesTodayToProgress(dateStr);
    libSyncFromReadingLog(dateStr);
  }
  saveDB();
  // Don't full re-render mid-typing — it would reset cursor position.
  // The value is already correct in the input; other UI (stat-mini
  // cards showing the same number) will catch up on next render.
}
// The heart of "auto plus that value to the reading progress": page
// you're on = the page you started today at (baselinePage, captured
// once per day) + however many pages you've logged today. Since it
// always recomputes from that fixed baseline rather than nudging
// pageFrom by the delta each time, typing 12 then correcting it to
// 8 lands on the right page either way — no drift, no double count,
// however many times "pages read today" gets edited in one sitting.
function applyPagesTodayToProgress(dateStr){
  const p = getPage(dateStr,'reading');
  if(p.baselinePage===undefined || p.baselinePage===null){
    const book = libCurrentBook();
    p.baselinePage = (book && book.pageCurrent) || 0;
  }
  p.pageFrom = p.baselinePage + (+p.pagesToday||0);
}

/* ============================================================
   PAGE: DAILY DASHBOARD
   ============================================================ */
function dashboardBody(dateStr){
  const p = getPage(dateStr,'dashboard');

    </div>`).join('');

// Moves a completed exercise into the trash instead of leaving it
// as the only way to permanently clear it out. The row's full data
// (name/sets/reps/weight) travels with it so trashRestore can drop
// it right back into this same day's log if it was deleted by mistake.
function deleteExerciseToTrash(dateStr,i){
  const p = getPage(dateStr,'workout');
  const ex = p.exercises[i];
  if(!ex) return;
  const summary = ex.name || 'Unnamed exercise';
  p.exercises.splice(i,1);
  // Pending-complete keys are index-based ("2026-09-14:3"), and the
  // splice just shifted every later index down by one — keeping the
  // old keys would hold the wrong row open in its hold window.
  Array.from(PENDING_COMPLETE_EX).forEach(k=>{ if(k.indexOf(dateStr+':')===0) PENDING_COMPLETE_EX.delete(k); });
  trashAdd('exercise', {name:ex.name,sets:ex.sets,reps:ex.reps,weight:ex.weight}, {dateStr}, summary);
  saveDB();
  flashSaved('Moved to trash');
  render();
}

// Checking an exercise off doesn't just mark it done — the checkbox
// fills in and the row sits fully ticked (inputs locked, so nothing
// can be edited mid-hold) for a couple seconds so the person
// actually sees the check register, and only then does the row
// animate out and drop off the visible log entirely, same pattern
// as Apple's Reminders/To Do. The data still remembers it was
// completed (ex.done stays true), it's just not shown as an open
// item anymore. Unchecking isn't offered from the log itself once
// it's gone; the row can always be restored from Trash if needed.
// PENDING_COMPLETE_EX (keyed "dateStr:i") is what keeps a just-
// checked row visible in the OPEN table during its hold window —
// see the filter in workoutBody — even though ex.done is already
// true. In-memory only; a hold in progress doesn't need to survive
// a reload.
const DONE_ROW_HOLD_MS = 2000;
let PENDING_COMPLETE_EX = new Set();
function toggleExDone(dateStr,i){
  const p = getPage(dateStr,'workout');
  const ex = p.exercises[i];
  const key = dateStr+':'+i;
  ex.done = !ex.done;
  markTouched(dateStr,'workout');
  flashSaved();
  if(ex.done){
    PENDING_COMPLETE_EX.add(key);
    render();
    setTimeout(()=>{
      // If it got unchecked again during the hold, there's nothing
      // to collapse — just clear the pending flag.
      if(!PENDING_COMPLETE_EX.has(key)) return;
      const row = document.getElementById(`ex-row-${i}`);
      if(row){
        row.classList.add('row-completing');
        setTimeout(()=>{ PENDING_COMPLETE_EX.delete(key); render(); }, 260);
      } else {
        PENDING_COMPLETE_EX.delete(key);
        render();
      }
    }, DONE_ROW_HOLD_MS);
    return;
  }
  PENDING_COMPLETE_EX.delete(key);
  render();
}

// chapter, fixing a typo) re-anchors the baseline the auto-add math
// works from, so subsequent changes to "pages read today" build on

function updateMonthlyField(pageId, mk, key, val){
  const page = getMonthlyPage(pageId, mk);
  if(key.indexOf('.')===-1){ page[key] = val; saveDB(); return; }
  const parts = key.split('.');
  let obj = page;
  for(let i=0;i<parts.length-1;i++){
    if(!obj[parts[i]] || typeof obj[parts[i]] !== 'object') obj[parts[i]] = {};
    obj = obj[parts[i]];
  }
  obj[parts[parts.length-1]] = val;
  saveDB();
}

// Same disappearing pattern as the workout exercise log: checking a
// goal off leaves it visible and ticked for a couple seconds (see
// DONE_ROW_HOLD_MS) before animating the row out, rather than
// vanishing or just striking it through instantly. The goal isn't
// deleted — item.done stays true and it still counts in the locked
// month-end summary — it just clears out of the active working list
// once its hold window passes.
let PENDING_COMPLETE_BUCKET = new Set();
function toggleBucketDone(mk,i){
  const item = getMonthlyPage('bucket',mk).items[i];
  const key = mk+':'+i;
  item.done = !item.done;
  flashSaved();
  saveDB();
  if(item.done){
    PENDING_COMPLETE_BUCKET.add(key);
    render();
    setTimeout(()=>{
      if(!PENDING_COMPLETE_BUCKET.has(key)) return;
      const row = document.getElementById(`bucket-row-${i}`);
      if(row){
        row.classList.add('row-completing');
        setTimeout(()=>{ PENDING_COMPLETE_BUCKET.delete(key); render(); }, 260);
      } else {
        PENDING_COMPLETE_BUCKET.delete(key);
        render();
      }
    }, DONE_ROW_HOLD_MS);
    return;
  }
  PENDING_COMPLETE_BUCKET.delete(key);
  render();
}
function cycleTier(mk,i){
  const order = ['MUST','WANT','SOMEDAY'];
  const item = getMonthlyPage('bucket',mk).items[i];
  const cur = order.indexOf(item.tier);
  item.tier = order[(cur+1)%3];
  saveDB();
  render();
}

// Moves a completed goal into the trash — the one truly permanent
// way to remove a bucket item (unchecking it from the "done" strip
// just reopens it). Full item data (text + tier) travels with the
// trash entry so trashRestore can drop it back into this same
// month's list if deleted by mistake.
function deleteBucketItemToTrash(mk,i){
  const page = getMonthlyPage('bucket',mk);
  const item = page.items[i];
  if(!item) return;
  const summary = item.text || 'Untitled goal';
  page.items.splice(i,1);
  // Same index-shift problem as the exercise log — clear this
  // month's pending keys so no unrelated row stays held open.
  Array.from(PENDING_COMPLETE_BUCKET).forEach(k=>{ if(k.indexOf(mk+':')===0) PENDING_COMPLETE_BUCKET.delete(k); });
  trashAdd('bucket', {tier:item.tier,text:item.text}, {monthKey:mk}, summary);
  saveDB();
  flashSaved('Moved to trash');
  render();
}

// Picks a reasonable default time to pre-fill the "add block" time
// input with: the next free half-hour after the latest existing
// block, or 07:00 if the timetable is empty. Purely a UX nicety —
// the person can change it before tapping Add.
function suggestNextBlockTime(usedTimes){
  if(!usedTimes || !usedTimes.size) return '07:00';
  let latest = -1;
  usedTimes.forEach(t=>{ const m = timeStrToMinutes(t); if(m>latest) latest=m; });
  let candidate = latest + TIME_STEP_MIN;
  let guard = 0;
  while(usedTimes.has(minutesToTimeStr(candidate)) && guard < 48){
    candidate += TIME_STEP_MIN;
    guard++;
  }
  return minutesToTimeStr(candidate);
}
function addTimetableBlockFromInput(){

   clock strip read from, without waiting for the real clock —
   a slider covering the full day plus quick-jump buttons for
   every timetable hour.
   ============================================================ */
function renderTestTimeSection(){
  const real = new Date();
  const overrideMins = getDebugTimeMinutes();
  const active = overrideMins !== null;
  const mins = active ? overrideMins : (real.getHours()*60 + real.getMinutes());
  const label = minutesToClockLabel(mins);
  const blocks = normalizeTimetableBlocks();

  const quickJumps = blocks.map((b,i)=>{
    const slotStart = timeStrToMinutes(b.time);
    const on = active && currentTimetableSlotIndex(nowForApp())===i;
    const mapped = getSlotMapping(b.time);
    return `<button class="test-jump-chip ${on?'active':''}" onclick="setDebugTimeMinutes(${slotStart}); render();">
      ${esc(fmtBlockTime(b.time))}${mapped?' •':''}
    </button>`;
  }).join('');

  return `
    <div class="settings-section test-time-section">
      <div class="settings-heading">Test tools <span class="test-badge">tester build</span></div>
      <div class="test-time-card">
        <div class="test-time-row">
          <div class="test-time-display">${active?'Simulated':'Live'} time</div>
          <div class="test-time-value" id="test-time-live-label">${esc(label)}</div>
        </div>
        <input type="range" class="test-time-slider" min="0" max="1439" step="5" value="${mins}"
          oninput="setDebugTimeMinutes(this.value); document.getElementById('test-time-live-label').textContent = minutesToClockLabel(this.value);">
        <div class="test-jump-row">${quickJumps}</div>
        <button class="add-row-btn" onclick="setDebugTimeMinutes(null); render();" ${active?'':'disabled'}>
          ${icon('history',13)} Back to real clock
        </button>
      </div>
      <div class="test-time-card" style="margin-top:10px;">
        <div class="fc-hint" style="margin:0 0 10px;">Backfills ${monthLabel()} with random dashboard/workout/reading/journal${DB.lane?'/lane':''} entries — days you've already logged are left untouched. Only for previewing how the Monthly Tracker charts look with data in them.</div>
        <button class="add-row-btn" onclick="randomFillMonth(currentMonthKey())">${icon('grid',13)} Fill ${monthLabelShort()} with test data</button>
        <button class="add-row-btn" style="color:var(--red);" onclick="confirmClearMonthData()">${icon('trash',13)} Clear ${monthLabelShort()}'s test data</button>
      </div>
    </div>
  `;
}
function confirmClearMonthData(){
  const mk = currentMonthKey();
  openSheet(`
    <div class="sheet-title"><span>Clear ${esc(monthLabel(mk))}?</span><button class="sheet-close" onclick="closeSheet()" aria-label="Close">${icon('close',15)}</button></div>

function minutesToClockLabel(mins){
  mins = Math.max(0, Math.min(1439, Math.round(+mins)));
  const h24 = Math.floor(mins/60), m = mins%60;
  const ampm = h24>=12 ? 'PM' : 'AM';
  let h12 = h24%12; if(h12===0) h12=12;
  return `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
}
// The slider's oninput needs to also trigger a re-render once the
// person lets go, so the focus card actually updates — but re-
// rendering on every drag tick would fight the slider's own DOM
// node mid-drag. onchange (fires on release) does the full render;
// oninput just keeps the live label in the settings screen honest.

/* ============================================================
   BOTTOM SHEET (generic) — used for the date picker and
   destructive confirmations so neither needs a full page nav.
   ============================================================ */
let SHEET_SCROLL_Y = 0;
function openSheet(innerHtml){
  closeSheet();
  SHEET_SCROLL_Y = window.scrollY || window.pageYOffset || 0;
  const backdrop = document.createElement('div');
  backdrop.className = 'sheet-backdrop';
  backdrop.id = 'active-sheet';
  backdrop.setAttribute('role','dialog');
  backdrop.setAttribute('aria-modal','true');
  backdrop.onclick = function(e){ if(e.target===backdrop) closeSheet(); };
  backdrop.innerHTML = `<div class="sheet"><div class="sheet-grabber"></div>${innerHtml}</div>`;
  document.body.appendChild(backdrop);
  document.documentElement.classList.add('sheet-open');
  document.body.classList.add('sheet-open');
  document.body.style.top = `-${SHEET_SCROLL_Y}px`;
  document.addEventListener('keydown', sheetEscHandler);
}
function sheetEscHandler(e){
  if(e.key==='Escape') closeSheet();
}
function closeSheet(){
  const el = document.getElementById('active-sheet');
  if(el) el.remove();
  document.removeEventListener('keydown', sheetEscHandler);
  if(document.body.classList.contains('sheet-open')){
    document.documentElement.classList.remove('sheet-open');
    document.body.classList.remove('sheet-open');
    document.body.style.top = '';
    window.scrollTo(0, SHEET_SCROLL_Y);
  }
}

/* ============================================================
   DATE PICKER — jump straight to any date instead of only
   scrolling a 7-day strip.
   ============================================================ */
let CAL_MONTH = null;
let CAL_PICKER_OPEN = false;
const CAL_MIN_YEAR = 1900;
const CAL_MAX_YEAR = 2100;

function openDatePicker(){
  const sel = new Date((SELECTED_DATE || todayStr())+'T00:00:00');
  CAL_MONTH = { y: sel.getFullYear(), m: sel.getMonth() };
  CAL_PICKER_OPEN = false;
  openSheet(renderCalendarSheet());
}
function toggleCalPicker(){
  CAL_PICKER_OPEN = !CAL_PICKER_OPEN;
  refreshCalendarSheet();
}
function calendarMonthOptions(selectedMonth){
  const names = Array.from({length:12}, (_,i)=>new Date(2000,i,1).toLocaleDateString('en-US',{month:'long'}));
  return names.map((name,i)=>`<option value="${i}" ${i===selectedMonth?'selected':''}>${name}</option>`).join('');
}
function calendarYearOptions(selectedYear){
  let out='';
  for(let y=CAL_MIN_YEAR; y<=CAL_MAX_YEAR; y++) out += `<option value="${y}" ${y===selectedYear?'selected':''}>${y}</option>`;
  return out;
}
function formatCalendarSelection(ds){
  const d=new Date(ds+'T00:00:00');
  return d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
}
function renderCalendarSheet(){
  const {y,m} = CAL_MONTH;
  const first = new Date(y,m,1);
  const startOffset = (first.getDay()+6)%7; // Monday-first
  const daysInMonth = new Date(y,m+1,0).getDate();
  const today = todayStr();
  const selected = SELECTED_DATE || today;

  let cells = '';
  for(let i=0;i<startOffset;i++) cells += `<div class="cal-day cal-day-empty" aria-hidden="true"></div>`;
  for(let day=1; day<=daysInMonth; day++) {
    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const isToday = ds===today;
    const isSel = ds===selected;
    const has = dayHasAny(ds);
    cells += `<button type="button" class="cal-day ${isToday?'today':''} ${isSel?'selected':''}" onclick="pickCalendarDate('${ds}')" aria-label="${formatCalendarSelection(ds)}" aria-pressed="${isSel}">`+
      `${day}${has?'<span class="cdot"></span>':''}</button>`;
  }
  const totalCells = startOffset + daysInMonth;
  for(let i=totalCells;i<42;i++) cells += `<div class="cal-day cal-day-empty" aria-hidden="true"></div>`;
  const dows = ['M','T','W','T','F','S','S'];
  const selectedLabel = formatCalendarSelection(selected);

  return `
    <div class="sheet-title">
      <span>Choose a day</span>
      <button class="sheet-close" onclick="closeSheet()" aria-label="Close">${icon('close',15)}</button>
    </div>
    <div class="cal-head">
      <div>
        <div class="cal-eyebrow">Selected</div>
        <div class="cal-selected-label">${selectedLabel}</div>
      </div>
      ${selected!==today ? `<button class="cal-today-chip" type="button" onclick="pickCalendarDate('${today}')">Today</button>` : ''}
    </div>
    <div class="cal-nav">
      <button class="cal-nav-btn" type="button" onclick="calShiftMonth(-1)" aria-label="Previous month">${icon('chevleft',16)}</button>
      <button class="cal-monthyear-btn" type="button" onclick="toggleCalPicker()" aria-label="Choose month and year" aria-expanded="${CAL_PICKER_OPEN?'true':'false'}">
        <span>${new Date(y,m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})}</span>
        ${icon('chevright',12,'class="cal-monthyear-caret"')}
      </button>
      <button class="cal-nav-btn" type="button" onclick="calShiftMonth(1)" aria-label="Next month">${icon('chevright',16)}</button>
    </div>
    ${CAL_PICKER_OPEN ? `
    <div class="cal-period-selectors">
      <select class="cal-period-select cal-month-select" aria-label="Month" onchange="calSetMonth(this.value)">${calendarMonthOptions(m)}</select>
      <select class="cal-period-select cal-year-select" aria-label="Year" onchange="calSetYear(this.value)">${calendarYearOptions(y)}</select>
    </div>` : ''}
    <div class="cal-grid" role="grid" aria-label="${new Date(y,m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})}">
      ${dows.map(d=>`<div class="cal-dow" role="columnheader">${d}</div>`).join('')}
      ${cells}
    </div>
    <div class="cal-footer">
      <div class="cal-footer-note">Days with a dot already have activity.</div>
      <button class="cal-today-btn" type="button" onclick="pickCalendarDate('${today}')">${icon('calendar',14)} Today</button>
    </div>
  `;
}
function calShiftMonth(delta){
  const d = new Date(CAL_MONTH.y, CAL_MONTH.m + delta, 1);
  const nextY = d.getFullYear();

function bxInitials(name){

  if(!sig.length) sig = words;

/* ---------- value helpers ---------- */
function bxNorm(type, raw){
  switch(type){
    case 'number': { if(raw===''||raw===null||raw===undefined||typeof raw==='boolean') return null; const n = typeof raw==='number' ? raw : parseFloat(raw); return isFinite(n) ? n : null; }
    case 'scale':  { const n = +raw; return n>0 ? n : null; }
    case 'toggle': return raw===true ? 1 : (raw===false ? 0 : null);
    case 'choice': return (typeof raw==='string' && raw) ? raw : null;
    case 'photo':  return (typeof raw==='string' && raw.indexOf('data:image')===0) ? raw : null;
    default:       return (typeof raw==='string' && raw.trim()) ? raw.trim() : null;
  }
}
function bxFieldIsShown(f, ds, pg){
  /* A removed field is offered on days BEFORE the removal date and not from it on.
     Its values are never touched, so older days still show them and the Tracker
     keeps charting them. */
  return !f.deleted || ds < f.deleted;
}
function bxDisplay(f, v){
  const n = bxNorm(f.type, v);
  if(n===null) return '';
  if(f.type==='number') return String(n) + (f.unit ? ' '+f.unit : '');
  if(f.type==='scale') return n+'/'+(f.max||5);
  if(f.type==='toggle') return n ? 'Yes' : 'No';
  if(f.type==='photo') return 'Photo';
  const s = String(n); return s.length>28 ? s.slice(0,27)+'…' : s;
}
function bxSummary(ds, id){
  const c = bxCfg(id); if(!c) return 'Logged';
  const pg = (DB.days[ds] && DB.days[ds].pages && DB.days[ds].pages[id]) || {};
  const live = c.fields.filter(f=>!f.deleted || bxNorm(f.type, pg['cf_'+f.id])!==null);
  if(!live.length) return 'Logged';
  const filled = live.filter(f=>bxNorm(f.type, pg['cf_'+f.id])!==null).length;
  return filled+' of '+live.length+' filled';
}

        onclick="bxToggle('${ds}','${box}','${f.id}')">${icon('check',14)}</div><div class="crow-text">${on?'Yes':'Not yet'}</div></div>`;

    if(F.type==='scale') f.max = F.max;
    if(F.type==='choice') f.options = options;

/* ---------- photo: compress before storing ---------- */
function bxCompress(file){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      try{
        const SIZES = [1024, 800, 640, 512], QUAL = [0.72, 0.62, 0.52, 0.42];
        let out = null;
        for(let i=0;i<SIZES.length;i++){
          const sc = Math.min(1, SIZES[i] / Math.max(img.naturalWidth, img.naturalHeight));
          const w = Math.max(1, Math.round(img.naturalWidth*sc)), h = Math.max(1, Math.round(img.naturalHeight*sc));
          const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
          const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0,0,w,h); cx.drawImage(img,0,0,w,h);
          out = cv.toDataURL('image/jpeg', QUAL[i]);
          if(out.length <= BX_PHOTO_MAX_CHARS) break;
        }
        URL.revokeObjectURL(url); resolve(out);
      }catch(e){ URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('decode')); };
    img.src = url;
  });
}
function bxPhotoPicked(input, ds, box, fid){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  flashSaved('Compressing photo…');
  bxCompress(file).then(function(uri){
    const p = getPage(ds, box), k = 'cf_'+fid, prev = p[k];
    p[k] = uri;
    if(!bxTrySave()){
      if(prev===undefined) delete p[k]; else p[k] = prev;
      flashSaved('Storage is full — photo not saved');
      return;
    }
    markTouched(ds, box); flashSaved('Photo saved'); render();
  }).catch(function(){ flashSaved('Couldn’t read that photo'); });
}
